    <style>
/* Route VORTEX — identidade visual
   Paleta: Navy Vortex #0B1426 · Noite #111D35 · Ciano Rota #22D3EE · Azul Fluxo #3B82F6 · Laranja Hub #F97316 · Gelo #E8F1FF · Neblina #94A3B8
   Tipografia: Space Grotesk (marca, títulos e números de destaque) · Inter (interface, tabelas e textos)
   Temas (js/tema.js grava a escolha): dark = Escuro (Navy Vortex) · light = Claro · mono = Monocromático · vertical = Noite · sem atributo = automático
   Layout: barra superior fina + área de trabalho que ocupa toda a tela; mapa em tela cheia com gavetas sobrepostas */
:root {
  /* Claro (também é a base quando o tema é automático e o sistema está claro) */
  --bg: #F3F6FB;
  --surface: #FFFFFF;
  --surface-2: #F4F7FC;
  --ink: #0B1426;
  --muted: #5B6A84;
  --line: #DFE6F0;
  --line-strong: #C5D0E0;
  --accent: #2563EB;
  --accent-ink: #FFFFFF;
  --accent-soft: #E6EEFE;
  --accent-2: #0891B2;
  --route: #EA580C;
  --ok: #15803D; --ok-soft: #DDF3E5;
  --warn: #B45309; --warn-soft: #FDF0D5;
  --bad: #DC2626; --bad-soft: #FDE3E3;
  --sel: #0B1426;
  --shadow: 0 1px 2px rgba(11,20,38,.06), 0 8px 24px rgba(11,20,38,.09);
  --map-bg: #E6ECF4;
  --lasso: #2563EB; --cmp-a: #2563EB; --cmp-b: #EA580C; --feriado: #DB2777;
  /* Marca: braços do vórtice, ponto central (hub) e anel em volta do hub */
  --vx-1: #0B1426; --vx-2: #0891B2; --vx-3: #2563EB; --vx-hub: #F97316; --vx-kicker: #0E7490; --vx-word: #0B1426;
  --top-bg: #FFFFFF;
  --glow: radial-gradient(1200px 500px at 12% -10%, rgba(37,99,235,.10), transparent 60%), radial-gradient(900px 420px at 100% 0%, rgba(34,211,238,.10), transparent 60%);
  --f-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-head: "Space Grotesk", "Inter", system-ui, sans-serif;
  --f-cond: var(--f-head);
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 8px;
  color-scheme: light;
}
/* Escuro · Navy Vortex (padrão) */
@media (prefers-color-scheme: dark) { :root:not([data-theme]) {
  --bg: #0B1426; --surface: #111D35; --surface-2: #16264A; --ink: #E8F1FF; --muted: #94A3B8;
  --line: #1E2E50; --line-strong: #2C3F66; --accent: #22D3EE; --accent-ink: #0B1426; --accent-soft: #10334B; --accent-2: #3B82F6;
  --route: #F97316; --ok: #34D399; --ok-soft: #0D3A35; --warn: #FBBF24; --warn-soft: #3A2E10; --bad: #F87171; --bad-soft: #3D1C26;
  --sel: #FFFFFF; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.45); --map-bg: #0E1930; color-scheme: dark;
  --lasso: #3B82F6; --cmp-a: #3B82F6; --cmp-b: #F97316; --feriado: #F472B6;
  --vx-1: #E8F1FF; --vx-2: #22D3EE; --vx-3: #3B82F6; --vx-hub: #F97316; --vx-kicker: #22D3EE; --vx-word: #E8F1FF;
  --top-bg: #0B1426;
  --glow: radial-gradient(1200px 520px at 10% -12%, rgba(59,130,246,.16), transparent 60%), radial-gradient(900px 420px at 100% 0%, rgba(34,211,238,.10), transparent 60%);
} }
:root[data-theme="dark"] {
  --bg: #0B1426; --surface: #111D35; --surface-2: #16264A; --ink: #E8F1FF; --muted: #94A3B8;
  --line: #1E2E50; --line-strong: #2C3F66; --accent: #22D3EE; --accent-ink: #0B1426; --accent-soft: #10334B; --accent-2: #3B82F6;
  --route: #F97316; --ok: #34D399; --ok-soft: #0D3A35; --warn: #FBBF24; --warn-soft: #3A2E10; --bad: #F87171; --bad-soft: #3D1C26;
  --sel: #FFFFFF; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.45); --map-bg: #0E1930; color-scheme: dark;
  --lasso: #3B82F6; --cmp-a: #3B82F6; --cmp-b: #F97316; --feriado: #F472B6;
  --vx-1: #E8F1FF; --vx-2: #22D3EE; --vx-3: #3B82F6; --vx-hub: #F97316; --vx-kicker: #22D3EE; --vx-word: #E8F1FF;
  --top-bg: #0B1426;
  --glow: radial-gradient(1200px 520px at 10% -12%, rgba(59,130,246,.16), transparent 60%), radial-gradient(900px 420px at 100% 0%, rgba(34,211,238,.10), transparent 60%);
}
/* Vertical · Noite: azul-noite mais aberto, destaque em Azul Fluxo */
:root[data-theme="vertical"] {
  --bg: #111D35; --surface: #172848; --surface-2: #1D3158; --ink: #E8F1FF; --muted: #9DB0CC;
  --line: #243A63; --line-strong: #344C7C; --accent: #3B82F6; --accent-ink: #FFFFFF; --accent-soft: #1B3768; --accent-2: #22D3EE;
  --route: #F97316; --ok: #34D399; --ok-soft: #123E3E; --warn: #FBBF24; --warn-soft: #3D3318; --bad: #F87171; --bad-soft: #43233A;
  --sel: #FFFFFF; --shadow: 0 1px 2px rgba(0,0,0,.35), 0 10px 28px rgba(3,8,20,.45); --map-bg: #13213D; color-scheme: dark;
  --lasso: #22D3EE; --cmp-a: #60A5FA; --cmp-b: #F97316; --feriado: #F472B6;
  --vx-1: #E8F1FF; --vx-2: #22D3EE; --vx-3: #3B82F6; --vx-hub: #F97316; --vx-kicker: #22D3EE; --vx-word: #E8F1FF;
  --top-bg: #111D35;
  --glow: radial-gradient(1100px 520px at 50% -18%, rgba(34,211,238,.12), transparent 62%);
}
/* Monocromático: azul e branco */
:root[data-theme="mono"] {
  --bg: #1A45C4; --surface: #1D4ED8; --surface-2: #2659E2; --ink: #FFFFFF; --muted: #C8D6FF;
  --line: #3A66E4; --line-strong: #5B82EC; --accent: #FFFFFF; --accent-ink: #1D4ED8; --accent-soft: #3262E6; --accent-2: #DBE6FF;
  --route: #FDBA74; --ok: #A7F3D0; --ok-soft: rgba(167,243,208,.16); --warn: #FDE68A; --warn-soft: rgba(253,230,138,.16); --bad: #FECACA; --bad-soft: rgba(254,202,202,.18);
  --sel: #FFFFFF; --shadow: 0 1px 2px rgba(6,20,70,.3), 0 10px 28px rgba(6,20,70,.35); --map-bg: #1A45C4; color-scheme: dark;
  --lasso: #0B1426; --cmp-a: #93C5FD; --cmp-b: #FDBA74; --feriado: #F9A8D4;
  --vx-1: #FFFFFF; --vx-2: #FFFFFF; --vx-3: #FFFFFF; --vx-hub: #FFFFFF; --vx-kicker: #DBE6FF; --vx-word: #FFFFFF;
  --top-bg: #1D4ED8;
  --glow: none;
}

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--f-body); overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num, td.n, .mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

#app { display: flex; flex-direction: column; height: 100%; }

/* ---------- Barra superior ---------- */
.top { display: flex; align-items: center; gap: 8px; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-block: 2px; padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); min-height: 34px; flex: none; font-size: 12.5px; }
.brand { display: flex; align-items: center; gap: 5px; font-family: var(--f-cond); font-weight: 600; font-size: 13px; letter-spacing: .01em; white-space: nowrap; border: 0; background: transparent; color: inherit; cursor: pointer; padding: 3px 6px; border-radius: 4px; }
.brand:hover { background: var(--surface-2); }
.brand b { color: var(--accent); font-weight: 600; }
.brand svg { color: var(--accent); }
.amb-pick { display: flex; align-items: center; gap: 6px; min-width: 0; }
.amb-pick select { max-width: 180px; min-width: 0; min-height: 24px; padding: 1px 4px; font-size: 12px; border-color: var(--line); }
.tabs { display: flex; gap: 0; overflow-x: auto; scrollbar-width: none; min-width: 0; flex: 1; }
.tabs::-webkit-scrollbar { display: none; }
.tab { border: 0; background: transparent; padding: 3px 8px; border-radius: 4px; cursor: pointer; color: var(--muted); font-size: 12.5px; white-space: nowrap; }
.tab:hover { background: var(--surface-2); color: var(--ink); }
.tab[aria-selected="true"] { background: var(--accent-soft); color: var(--accent); }
.save:not(.err) .txt { display: none; }
.save { font-size: 12px; color: var(--muted); white-space: nowrap; display: flex; align-items: center; gap: 6px; }
.save .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
.save.pending .dot { background: var(--warn); }
.save.err .dot { background: var(--bad); }
.save button { border: 1px solid var(--line); background: var(--surface); border-radius: 4px; padding: 1px 6px; cursor: pointer; font-size: 12px; }

/* ---------- Controles base ---------- */
select, input[type=text], input[type=password], input[type=number], input[type=search], textarea {
  background: var(--surface); border: 1px solid var(--line-strong); border-radius: 5px; padding: 5px 8px; min-height: 30px; }
textarea { width: 100%; min-height: 120px; font-family: var(--f-mono); font-size: 12px; }
input[type=color] { width: 30px; height: 26px; padding: 0; border: 1px solid var(--line-strong); border-radius: 4px; background: none; cursor: pointer; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink);
  border-radius: 5px; padding: 5px 11px; min-height: 30px; cursor: pointer; white-space: nowrap; font-weight: 500; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
.btn.danger.armed { background: var(--bad); color: #fff; border-color: var(--bad); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.sm { padding: 2px 8px; min-height: 26px; font-size: 12.5px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 5px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 4px 9px; cursor: pointer; font-size: 12.5px; color: var(--muted); border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.chk { display: flex; align-items: center; gap: 7px; cursor: pointer; font-size: 13px; }
.chk input { accent-color: var(--accent); width: 15px; height: 15px; }
.lbl { font-family: var(--f-cond); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 500; }
.pill { display: inline-block; font-size: 11.5px; padding: 1px 7px; border-radius: 99px; font-weight: 600; white-space: nowrap; font-family: var(--f-cond); letter-spacing: .02em; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.idle { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.sw { display: inline-block; width: 11px; height: 11px; border-radius: 3px; flex: none; }
.muted { color: var(--muted); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.daychips { display: inline-flex; gap: 3px; flex-wrap: wrap; }
.daychips button { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 4px; padding: 2px 7px; font-size: 12px; cursor: pointer; min-width: 34px; }
.daychips button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }

main { position: relative; flex: 1; min-height: 0; }

/* ---------- Mapa ---------- */
#mapView { position: absolute; inset: 0; }
#map { position: absolute; inset: 0; background: var(--map-bg); }
body.immersive .top { display: none; }
body.tool-lasso #map, body.tool-rect #map { touch-action: none; }
body.tool-lasso #map .leaflet-container, body.tool-lasso #map, body.tool-rect #map, body.tool-ruler #map, body.tool-place #map, body.tool-place #map .leaflet-interactive { cursor: crosshair; }

.float { position: absolute; z-index: 1001; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); }
#toolbar { top: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 2px; padding: 4px; align-items: center; }
#toolbar .sep { width: 1px; height: 22px; background: var(--line); margin: 0 4px; }
.tb { width: 34px; height: 34px; display: grid; place-items: center; border: 0; background: transparent; border-radius: 6px; cursor: pointer; color: var(--ink); position: relative; }
.tb:hover { background: var(--surface-2); }
.tb[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.tb svg { width: 18px; height: 18px; }

.drawer { top: 58px; bottom: 60px; width: 320px; display: flex; flex-direction: column; overflow: hidden; }
.drawer.left { left: max(10px, env(safe-area-inset-left, 0px)); }
.drawer.right { right: max(10px, env(safe-area-inset-right, 0px)); }
.drawer header { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 9px 12px; border-bottom: 1px solid var(--line); flex: none; }
.drawer header h2 { margin: 0; font-family: var(--f-cond); font-size: 14px; font-weight: 600; letter-spacing: .02em; }
.drawer .body { overflow-y: auto; padding: 10px 12px 14px; display: flex; flex-direction: column; gap: 14px; min-height: 0; }
.drawer-toggle { position: absolute; z-index: 1001; top: 58px; }
#btnLayers { left: max(10px, env(safe-area-inset-left, 0px)); }
#btnSel { right: max(10px, env(safe-area-inset-right, 0px)); }
.drawer-toggle .count { background: var(--route); color: #fff; border-radius: 99px; font-size: 11px; padding: 0 6px; font-family: var(--f-mono); }

/* Painel Roteirizar: rotas, formato e botão primeiro; o resto fica recolhível */
.rz { display: flex; flex-direction: column; gap: 14px; }
.rzl { display: grid; grid-template-columns: 62px 1fr; gap: 8px; align-items: center; }
.seg.rzvisao { grid-template-columns: repeat(3, 1fr); flex: none; }
.bzlist { display: flex; flex-direction: column; gap: 2px; max-height: 188px; overflow-y: auto; border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; }
.bzlist .chk { padding: 2px 0; font-size: 12.5px; }
.bzlist .chk[hidden] { display: none; }
.bznm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rkrow { width: 100%; text-align: left; cursor: pointer; }
.rkrow:hover { border-color: var(--accent); }
.rzsetor { padding: 10px; border: 1px solid var(--line-strong); border-radius: 7px; background: var(--surface-2); }
.rzsetor .tsec { background: var(--surface); }
.rzl select { width: 100%; min-width: 0; }
.rzl .daychips button, #selPanel .daychips button { min-width: 0; padding: 2px 5px; }
.rzn { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12.5px; }
.rzseg { display: grid; grid-template-columns: 1fr 1fr; }
.rzseg button { padding: 6px 9px; font-size: 13px; font-weight: 500; }
.rzhint { margin: 0; font-size: 12px; color: var(--muted); }
.rzgo { justify-content: center; width: 100%; min-height: 36px; white-space: normal; }
.rzsec { border-top: 1px solid var(--line); padding-top: 10px; }
.rzb { border-top: 1px solid var(--line); padding-top: 12px; }
.nmbtn { display: block; width: 100%; padding: 0; border: 0; background: transparent; font-weight: 600; font-size: 13px; text-align: left; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nmbtn:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
.arvbtn svg { transition: transform .12s; }
.arvbtn[aria-expanded="true"] svg { transform: rotate(180deg); }
.rzsec > summary { cursor: pointer; font-family: var(--f-cond); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 500; }
.rzsec > summary:hover { color: var(--ink); }
.rzsec[open] > summary { margin-bottom: 10px; }
.rzsec > .stack + .stack { margin-top: 14px; }

.tree { display: flex; flex-direction: column; gap: 2px; }
.tsec { border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
.tsec > .th { display: grid; grid-template-columns: auto auto 1fr auto auto; gap: 7px; align-items: center; padding: 6px 7px; cursor: default; }
.tsec .th .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; font-size: 13px; }
.tsec .th .sub { font-size: 11.5px; color: var(--muted); font-weight: 400; }
.tsec .th .meta { font-size: 11px; color: var(--muted); text-align: right; line-height: 1.25; }
.iconbtn { border: 0; background: transparent; cursor: pointer; color: var(--muted); padding: 2px 4px; border-radius: 4px; line-height: 0; }
.iconbtn:hover { color: var(--ink); background: var(--surface-2); }
.iconbtn svg { width: 15px; height: 15px; }
.tsec .grid { padding: 4px 8px 8px 26px; display: grid; gap: 3px; }
.wkrow { display: grid; grid-template-columns: 26px 1fr; gap: 5px; align-items: center; }
.wkrow .wk { font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
.rchips { display: grid; gap: 3px; }
.rchip { border: 1px solid var(--line-strong); border-radius: 4px; background: var(--surface); padding: 1px 4px; font-size: 11px; cursor: pointer; display: inline-flex; gap: 3px; align-items: baseline; justify-content: space-between; color: var(--muted); min-width: 0; white-space: nowrap; }
.rchip b { color: var(--ink); font-weight: 600; }
.rchip.on { background: var(--surface-2); border-color: var(--rc, var(--accent)); box-shadow: inset 0 -2px 0 var(--rc, var(--accent)); color: var(--ink); }
.rchip.over b { color: var(--bad); }

#mapSummary { left: 50%; transform: translateX(-50%); bottom: 12px; display: flex; gap: 0; padding: 0; overflow: hidden; max-width: calc(100% - 20px); }
#mapSummary .kpi { padding: 6px 12px; border-right: 1px solid var(--line); white-space: nowrap; }
#mapSummary .kpi:last-child { border-right: 0; }
#mapSummary .kpi .v { font-family: var(--f-mono); font-size: 13.5px; font-weight: 600; font-variant-numeric: tabular-nums; }

/* Títulos em Space Grotesk; rótulos e tabelas em Inter */

/* Botão e menu de tema */

  /* Sequência: vizinho mais próximo + 2-opt. base opcional (rota fechada ida/volta). Retorna índices de pts. */
  function sequence(base, pts) {
    const n = pts.length;
    if (n <= 1) return [...Array(n).keys()];
    const nodes = base ? [base, ...pts] : pts.slice();
    const P = projector(nodes);
    const xy = nodes.map(P);
    const m = nodes.length;
    const D = (a, b) => Math.hypot(xy[a].x - xy[b].x, xy[a].y - xy[b].y);

    const used = new Uint8Array(m);
    let start = 0;

    const t = [start]; used[start] = 1;

  /* Métricas de uma rota. base pode ser null. pts com {lat,lng,t(min)} na ordem. */
  function routeMetrics(base, pts, p) {

    for (let i = 0; i < pts.length; i++) {

    if (base && pts.length) {
      kmIda = hav(base, pts[0]) * fator;
      kmVolta = hav(pts[pts.length - 1], base) * fator;

    const km = kmIda + kmEntre + kmVolta;

  function weeksAll(W) { return [...Array(W).keys()].map(i => i + 1); }

  /* Setorização: devolve rótulos e centros */
  function sectorize(clients, k, opts = {}) {

  function assignNearest(centers, colabs) {

class BucketStore {
  constructor(coll) { this.coll = coll; this.map = new Map(); this.dirty = new Set(); this.t = null; this.busy = false; this.again = false; Save.stores.add(this); }
  async load() { this.map.clear(); const docs = await withRetry(() => st.backend.list(this.coll)); for (const d of docs) { const it = (d.data && d.data.items) || {}; for (const k in it) this.map.set(k, it[k]); } }
  get(k) { return this.map.get(k); }
  has(k) { return this.map.has(k); }
  values() { return this.map.values(); }
  get size() { return this.map.size; }
  put(k, v) { if (st.ro) return; this.map.set(k, v); this.dirty.add(bucketOf(k)); this.sched(); }
  del(k) { if (st.ro) return; if (this.map.delete(k)) { this.dirty.add(bucketOf(k)); this.sched(); } }
  replaceAll(m) { for (const k of this.map.keys()) this.dirty.add(bucketOf(k)); this.map = m; for (const k of m.keys()) this.dirty.add(bucketOf(k)); this.sched(); }
  markAll() { for (let i = 0; i < NB; i++) this.dirty.add('b' + String(i).padStart(2, '0')); }
  sched() { clearTimeout(this.t); this.t = setTimeout(() => { this.t = null; this.flush(); }, 650); Save.update(); }
  async flush() {
    if (st.ro) return;
    if (this.busy) { this.again = true; return; }
    this.busy = true; Save.update();
    let bs = [];
    try {
      while (this.dirty.size) {
        bs = [...this.dirty]; this.dirty.clear();
        const groups = new Map(bs.map(b => [b, {}]));
        for (const [k, v] of this.map) { const b = bucketOf(k); const g = groups.get(b); if (g) g[k] = v; }
        for (const [b, items] of groups) {
          if (Object.keys(items).length) await withRetry(() => st.backend.set(this.coll, b, { items }));
          else await withRetry(() => st.backend.del(this.coll, b));
          bs = bs.filter(x => x !== b);
        }
      }
      Save.err = null;
    } catch (e) {
      bs.forEach(b => this.dirty.add(b));
      Save.err = e || { message: 'erro' };
      if (e && e.code === 'invalid_argument') { st.ro = true; Save.err = { message: 'sem permissão de edição' }; }
    } finally {
      this.busy = false;
      if (this.again) { this.again = false; if (this.dirty.size && !Save.err) this.flush(); }
      Save.update();
    }
  }
  async destroy() { this.map.clear(); this.dirty.clear(); for (let i = 0; i < NB; i++) { try { await withRetry(() => st.backend.del(this.coll, 'b' + String(i).padStart(2, '0'))); } catch (e) { /* ignora */ } } Save.stores.delete(this); }
  detach() { Save.stores.delete(this); }
}

/* Rotas derivadas (setor × semana × dia) */
function buildRoutes(a, items, geo) {
  const routes = new Map(); if (!a || !items) return routes;
  const p = P(a);
  for (const [sold, it] of items) {
    for (const k of itemKeys(it, a)) {
      let r = routes.get(k);
      if (!r) { const [s, w, d] = k.split('|'); r = { k, s, w: +w, d: +d, stops: [] }; routes.set(k, r); }
      r.stops.push(sold);
    }
  }
  for (const r of routes.values()) {
    const qv = s => { const q = items.get(s).q; const v = q && q[r.d]; return isNum(v) ? v : 9999; };
    r.stops.sort((x, y) => qv(x) - qv(y));
    const pts = r.stops.map(cliPt).filter(Boolean);
    const col = colabOfSetor(r.s, a);
    r.m = E.routeMetrics(baseOf(r.s, a), pts, { ...p, jornada: (col && col.jornada) || p.jornada });
    r.missing = r.stops.length - pts.length;
    r.sig = routeSig(r.stops, baseOf(r.s, a));
    const real = geo && geo.get(r.k);
    r.stale = !!(real && real.sig !== r.sig);
    if (real && real.sig === r.sig) {
      const tDesl = real.min, total = tDesl + r.m.tAtend;
      r.m = { ...r.m, kmIda: real.kmIda, kmEntre: real.kmEntre, kmVolta: real.kmVolta, km: real.km, tDesl, total, ocup: r.m.jornada ? total / r.m.jornada : 0, real: true, src: real.src || 'osrm', o: real.o || 'rapida', toll: real.toll, terra: real.terra };
    }

}
function rebuild() { st.routes = buildRoutes(amb(), st.itens && st.itens.map, st.geo && st.geo.map); }
function routeLabel(r) { const s = setorOf(r.s); return `${s ? s.nome : '?'} · S${r.w} · ${DIA_L[r.d]}`; }
function sortedRoutes(list) {
  const so = new Map(sortedSetores().map(([id], i) => [id, i]));
  return list.sort((a, b) => (so.get(a.s) ?? 999) - (so.get(b.s) ?? 999) || a.w - b.w || a.d - b.d);

  if (st.hiddenSet.has(it.s)) return false;

/* Desfazer, refazer e histórico: cada passo guarda o estudo como estava antes (setores, clientes, dias, semanas,
   sequências e o traçado pelas ruas). Vale enquanto a janela estiver aberta, separado por estudo. */
const HIST_MAX = 30; let histSeq = 0;
function fotoEstudo() { return { amb: st.cur, itens: new Map(st.itens.map), geo: st.geo ? new Map(st.geo.map) : null, meta: clone(amb()) }; }
function pushUndo(label) {
  if (!st.itens) return;
  st.undo.push({ label, em: Date.now(), id: ++histSeq, ...fotoEstudo() });
  const doEstudo = st.undo.filter(u => u.amb === st.cur);
  if (doEstudo.length > HIST_MAX) st.undo.splice(st.undo.indexOf(doEstudo[0]), 1);
  st.redo = st.redo.filter(u => u.amb !== st.cur); // nova alteração descarta o que havia para refazer
}
function histDoEstudo(pilha) { return pilha.filter(u => u.amb === st.cur); }
function ultimoDoEstudo(pilha) { for (let i = pilha.length - 1; i >= 0; i--) if (pilha[i].amb === st.cur) return i; return -1; }
function restauraFoto(u) { st.itens.replaceAll(new Map(u.itens)); if (st.geo && u.geo) st.geo.replaceAll(new Map(u.geo)); st.amb.put(u.meta.id, clone(u.meta)); }
function podeVoltar() {
  if (!st.itens) { toast('Abra um estudo para desfazer'); return false; }
  if (st.ro) { toast('Estudo em modo somente leitura'); return false; }
  if (job) { toast('Aguarde o cálculo pelas ruas terminar, ou cancele, antes de desfazer'); return false; }
  return true;
}
function doUndo(silencioso) {
  if (!podeVoltar()) return null;
  const i = ultimoDoEstudo(st.undo); if (i < 0) { if (!silencioso) toast('Nada para desfazer neste estudo'); return null; }
  const u = st.undo.splice(i, 1)[0];
  st.redo.push({ label: u.label, em: u.em, id: u.id, ...fotoEstudo() });
  restauraFoto(u);
  if (!silencioso) { rebuild(); renderAll(); toast('Desfeito: ' + u.label, 6000, 'redo', 'Refazer'); }
  return u;
}
function doRedo() {
  if (!podeVoltar()) return;
  const i = ultimoDoEstudo(st.redo); if (i < 0) { toast('Nada para refazer'); return; }
  const r = st.redo.splice(i, 1)[0];
  st.undo.push({ label: r.label, em: r.em, id: r.id, ...fotoEstudo() });
  restauraFoto(r); rebuild(); renderAll(); toast('Refeito: ' + r.label, 6000, 'undo', 'Desfazer');
}
// Volta o estudo para como estava antes do passo escolhido, desfazendo também os que vieram depois
function voltarPara(id) {
  const lista = histDoEstudo(st.undo), alvo = lista.find(u => u.id === id); if (!alvo || !podeVoltar()) return;
  let n = 0; for (;;) { const u = doUndo(true); if (!u) break; n++; if (u === alvo) break; }
  rebuild(); renderAll(); closeModal();
  toast(`Estudo voltou para antes de “${alvo.label}”${n > 1 ? ` (${n} alterações desfeitas)` : ''}`, 7000, 'redo', 'Refazer');
}
function historicoForm() {
  const lista = histDoEstudo(st.undo), refaz = histDoEstudo(st.redo);
  const hora = t => new Date(t).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  const linhas = [...lista].reverse().map((u, i) => `<div class="hist-row"><div><b>${esc(u.label)}</b><div class="muted">${hora(u.em)}${i === 0 ? ' · última alteração' : ''}</div></div><button class="btn sm" type="button" data-act="histvolta" data-hid="${u.id}"${st.ro ? ' disabled' : ''}>Voltar para antes disto</button></div>`).join('');
  const linhasRefaz = [...refaz].reverse().map(u => `<div class="hist-row desfeito"><div><b>${esc(u.label)}</b><div class="muted">${hora(u.em)} · desfeita</div></div></div>`).join('');
  openModal(`<div class="dh"><h2>Histórico de alterações</h2><button class="iconbtn" data-close aria-label="Fechar">${ICON.close}</button></div>
  <div class="db stack">
    <p class="muted" style="margin:0;font-size:12.5px">Escolha um passo para deixar o estudo como estava antes dele. Os passos posteriores também são desfeitos, e tudo pode ser refeito. O histórico vale enquanto esta janela estiver aberta.</p>
    ${linhas ? `<div class="hist">${linhas}</div>` : '<p class="muted" style="margin:0">Nenhuma alteração para desfazer neste estudo.</p>'}
    ${linhasRefaz ? `<div class="lbl">Para refazer</div><div class="hist">${linhasRefaz}</div>` : ''}
  </div>
  <div class="df"><button class="btn" type="button" data-act="undo"${lista.length && !st.ro ? '' : ' disabled'}>Desfazer a última</button><button class="btn" type="button" data-act="redo"${refaz.length && !st.ro ? '' : ' disabled'}>Refazer${refaz.length ? ` (${refaz.length})` : ''}</button><button class="btn primary" type="button" data-close>Fechar</button></div>`);
}

function loadGoogle() {
  return new Promise((res, rej) => {
    if (window.google && google.maps && google.maps.Map) { res(); return; }
    let done = false; const fin = (fn, v) => { if (!done) { done = true; fn(v); } };
    window.__rtGmapsReady = () => fin(res);

    const sc = document.createElement('script');
    sc.src = 'https://maps.googleapis.com/maps/api/js?key=' + encodeURIComponent(GMAPS_KEY) + '&callback=__rtGmapsReady&language=pt-BR&region=BR';
    sc.async = true;
    sc.onerror = () => fin(rej, new Error(inClaude() ? 'a janela do Claude só permite scripts de alguns CDNs, e o Google Maps não está entre eles' : 'o script do Google não carregou (sem internet ou bloqueado)'));

  setBase();

function gErr(e) {
  const c = (e && (e.code || e.status || e.message)) || 'erro';
  if (/REQUEST_DENIED/i.test(c)) return 'pedido negado pelo Google — ative a API correspondente (Directions ou Geocoding) no Google Cloud para esta chave';
  if (/OVER_QUERY_LIMIT|OVER_DAILY_LIMIT/i.test(c)) return 'limite de consultas do Google atingido; aguarde e tente de novo';
  if (/ZERO_RESULTS|NOT_FOUND/i.test(c)) return 'o Google não encontrou caminho entre os pontos';
  return String(c);

function routeSig(stops, b) { const s = stops.join(',') + '|' + (b ? b.lat.toFixed(5) + ',' + b.lng.toFixed(5) : '-'); let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36) + ':' + stops.length; }

  const ds = new google.maps.DirectionsService(); const legs = [], path = []; let order = null;
  for (let i = 0; i < nodes.length - 1; i += 26) {
    const seg = nodes.slice(i, i + 27); if (seg.length < 2) break;
    const res = await ds.route({ origin: seg[0], destination: seg[seg.length - 1], waypoints: seg.slice(1, -1).map(p => ({ location: { lat: p.lat, lng: p.lng }, stopover: true })), travelMode: google.maps.TravelMode.DRIVING, optimizeWaypoints: !!optimize, avoidTolls: !!semPedagio, region: 'br' });

function startGoogle() {
  if (st.g !== 'idle') return; st.g = 'loading';
  loadGoogle().then(() => {

    const wait = (n = 0) => { if (L.gridLayer && L.gridLayer.googleMutant) { st.g = 'ready'; setBase(); renderAll(); toast('Google Maps conectado'); } else if (n < 40) setTimeout(() => wait(n + 1), 100); else { st.g = 'fail'; st.gMsg = 'o componente de integração não carregou'; onGoogleFail(); } };

function initLasso() {

    let rows = '';

      const sm = sumRoutes(rs);
      rows += `<tr class="sub"><td></td><td colspan="4">Subtotal ${esc(s.nome)} · ${rs.length} rotas</td><td class="n">${sm.n}</td><td class="n" colspan="3"></td><td class="n">${fkm(sm.km)}</td><td class="n">${fhm(sm.tDesl)}</td><td class="n">${fhm(sm.tAtend)}</td><td class="n">${fhm(sm.total)}</td><td>${ocPill(sm.ocMed)}</td></tr>`;
    }
    rows += `<tr class="tot"><td></td><td colspan="4">Total do estudo · ${all.length} rotas</td><td class="n">${tot.n}</td><td colspan="3"></td><td class="n">${fkm(tot.km)}</td><td class="n">${fhm(tot.tDesl)}</td><td class="n">${fhm(tot.tAtend)}</td><td class="n">${fhm(tot.total)}</td><td>${ocPill(tot.ocMed)}</td></tr>`;
    body = `<div class="tblwrap"><table class="t"><thead><tr><th></th><th>Setor</th><th>Colaborador</th><th class="n">Sem.</th><th>Dia</th><th class="n">Visitas</th><th class="n">KM ida</th><th class="n">KM entre</th><th class="n">KM volta</th><th class="n">KM total</th><th class="n">Desloc.</th><th class="n">Atend.</th><th class="n">Total</th><th>Jornada</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }
  return `<div class="page">
    <div class="ph"><div><h1>Roteiros · ${esc(a.nome)}</h1><p>Cada rota é um setor em uma semana do ciclo e um dia. Clique numa rota para abri-la sozinha no mapa.</p></div>
      <div class="row"><button class="btn" data-exp="roteiro">Exportar Excel</button><button class="btn" data-imp="roteiro">Importar roteiro</button><button class="btn" data-modelo="roteiro">Baixar modelo</button></div></div>

      <select id="rSet"><option value="">Todos os setores</option>${sortedSetores().map(([id, s]) => `<option value="${esc(id)}"${pg.setor === id ? ' selected' : ''}>${esc(s.nome)}</option>`).join('')}</select>

      <span class="muted">Formato: <b style="color:var(--ink)">${esc(rotaTxt(rotaKey(rotaOpt())))}</b></span>
      <span class="grow"></span>
      <span class="muted">Ciclo de ${W} semana(s) · <b class="num">${fkm(tot.km)}</b> km · <b class="num">${fhm(tot.total)}</b> · ${all.length} rotas</span>
    </div>
    ${body}</div>`;
}

/* ----- Estudos ----- */
function ambStats(a, items, routes) {
  const t = sumRoutes([...routes.values()]);
  let nSet = 0; for (const it of items.values()) if (it.s && a.setores && a.setores[it.s]) nSet++;
  const max = Math.max(0, ...[...routes.values()].map(r => r.m.ocup));
  return { clientes: items.size, setorizados: nSet, setores: Object.keys(a.setores || {}).length, rotas: routes.size, km: t.km, horas: t.total, oc: t.ocMed, ocMax: max };
}

    return;

function runAutoSet() {
  const a = amb(); const esc_ = $('#aEsc').value; const k = Math.max(1, +$('#aK').value || 1); const by = $('#aBy').value;
  const cods = $$('[data-acol]:checked').map(x => x.dataset.acol);
  const colabs = cods.map(c => st.col.get(c)).filter(Boolean);
  pushUndo('Setorização automática');
  if (esc_ === 'encaixe') return encaixar();
  const cls = [...st.itens.map.keys()].map(cliPt).filter(Boolean);
  if (!cls.length) { toast('O estudo não tem clientes com coordenadas'); st.undo.pop(); return; }
  const res = E.buildStudy(cls, colabs, k, P(), { by, seed: (Date.now() % 997) + 1 });
  // mantém clientes sem coordenada como "sem setor"
  const m = new Map(); for (const sold of st.itens.map.keys()) m.set(sold, res.itens.get(sold) || { s: '', d: [], w: [], q: {} });
  touchAmb(x => { x.setores = res.setores; }); if (st.geo) st.geo.replaceAll(new Map()); st.pathCache.clear();
  st.itens.replaceAll(m); st.hidden.clear(); st.hiddenSet.clear();
  rebuild(); renderAll(); toastU(`${Object.keys(res.setores).length} setores criados e roteirizados`);
  if ($('#aRoad') && $('#aRoad').checked && roadOk()) roadJob([...st.routes.keys()], true, 'Estudo roteirizado pelas ruas');
}
function encaixar() {
  const a = amb(); const sets = sortedSetores(); if (!sets.length) { toast('Crie setores antes de encaixar'); st.undo.pop(); return; }
  const cent = new Map(); for (const [sold, it] of st.itens.map) { if (!it.s || !setorOf(it.s)) continue; const p = cliPt(sold); if (!p) continue; const c = cent.get(it.s) || { lat: 0, lng: 0, n: 0 }; c.lat += p.lat; c.lng += p.lng; c.n++; cent.set(it.s, c); }
  for (const c of cent.values()) { c.lat /= c.n; c.lng /= c.n; }
  const W = P().semanas; const touched = new Set(); let n = 0;
  for (const [sold, it] of st.itens.map) {
    if (it.s && setorOf(it.s)) continue; const p = cliPt(sold); if (!p) continue;
    let best = null, bd = Infinity; for (const [sid, c] of cent) { const d = E.hav(p, c); if (d < bd) { bd = d; best = sid; } }
    if (!best) continue;
    // dia do vizinho roteirizado mais próximo do mesmo setor
    let nd = null, ndd = Infinity; for (const [s2, it2] of st.itens.map) { if (it2.s !== best || !(it2.d || []).length) continue; const p2 = cliPt(s2); if (!p2) continue; const d = E.hav(p, p2); if (d < ndd) { ndd = d; nd = it2; } }
    const d = nd ? [nd.d[0]] : [P().dias[0]];
    const load = {}; for (const r of st.routes.values()) if (r.s === best && r.d === d[0]) load[r.w] = r.m.total;
    const nv = { s: best, d, w: weeksByFreq(p.f, W, load), q: {} };
    st.itens.put(sold, nv); touched.add(best + '|' + d[0]); n++;
  }
  resequence(touched); rebuild(); renderAll(); toastU(`${n} cliente(s) encaixados no setor mais próximo`);
}
function runAutoRoute() {
  pushUndo('Roteirização automática');
  for (const [sid] of sortedSetores()) {
    const solds = [...st.itens.map].filter(([, it]) => it.s === sid).map(([s]) => s);
    const res = E.autoRoute(solds.map(cliPt).filter(Boolean), baseOf(sid), P(), { seed: 3 });
    for (const [sold, v] of res) st.itens.put(sold, { ...st.itens.get(sold), d: v.d, w: v.w, q: v.q });

}

function sameCity(a, b) { const x = norm(a), y = norm(b); return !x || !y || x === y || x.includes(y) || y.includes(x); }

  const s = [...cands].sort((x, y) => (ok(y) - ok(x)) || RANK[x.nivel] - RANK[y.nivel])[0];

async function geoOSM(o) {

/* Fila em segundo plano: o sistema continua utilizável enquanto busca */
function geoEnqueue(items) {
  if (!geoQ.busy && !geoQ.list.length) Object.assign(geoQ, { done: 0, total: 0, ok: 0, fail: 0, err: '', cancelled: false });
  let n = 0;
  for (const [k, id] of items) { const key = qKey(k, id); if (geoQ.set.has(key)) continue; geoQ.set.add(key); geoQ.list.push([k, id]); geoQ.total++; n++; }
  if (n) { renderGeoBar(); geoRun(); }
  return n;
}
async function geoRun() {
  if (geoQ.busy) return; geoQ.busy = true; geoQ.cancel = false;
  let google = geoQ.src === 'google' ? await ensureGoogle() : false;
  if (geoQ.src === 'google' && !google) toast('O Google não está disponível agora — buscando pelo OpenStreetMap (gratuito)', 5000);
  geoQ.usedGoogle = google; renderGeoBar();
  let since = 0;
  try {
    while (geoQ.list.length && !geoQ.cancel) {
      const [k, id] = geoQ.list[0];
      const store = k === 'col' ? st.col : st.cli, o = store.get(id);
      if (o && !hasXY(o)) {
        let r;
        try { r = await geocodeAddr(o, google); }
        catch (e) {
          if (google && e.code === 'denied') { google = false; geoQ.usedGoogle = false; toast('O Google recusou a busca de endereços (' + e.message + '). Continuando pelo OpenStreetMap.', 7000); continue; }
          geoQ.err = e.message || String(e); break;
        }
        applyGeo(store, id, r);
        if (r.ok) geoQ.ok++; else geoQ.fail++;
      }
      geoQ.list.shift(); geoQ.set.delete(qKey(k, id)); geoQ.done++;
      renderGeoBar();
      if (++since >= 20) { since = 0; geoRefresh(); }
    }
  } finally {
    if (geoQ.list.length) { geoQ.cancelled = geoQ.cancel; geoQ.list.forEach(([k, id]) => geoQ.set.delete(qKey(k, id))); geoQ.list = []; }

function downloadModelo(kind) {

  ws['!cols'] = m.cols.map(c => ({ wch: Math.max(12, c[0].length + 3, String(c[3]).length + 2) }));

function homeScatter(f, soColab) {

  if (!pts) { const all = [...st.cli.values()].filter(c => isNum(c.lat) && isNum(c.lng)), stride = Math.max(1, Math.ceil(all.length / 3000)); pts = all.filter((c, i) => i % stride === 0).map(c => [c.lat, c.lng, '']); }
  const bases = [...st.col.values()].filter(c => isNum(c.lat) && isNum(c.lng) && (!soColab || c.codigo === soColab));
  if (!pts.length && !bases.length) return '<div class="empty"><p>Nenhum cliente ou base com coordenadas ainda. Importe as planilhas em Importação: as coordenadas são buscadas pelo endereço.</p><button class="btn sm" data-go="importar">Abrir Importação</button></div>';
  const q = (arr, p) => arr[Math.round(p * (arr.length - 1))];
  const ys = pts.map(p => p[0]).sort((a, b) => a - b), xs = pts.map(p => p[1]).sort((a, b) => a - b), big = ys.length > 40;
  let la0 = big ? q(ys, .01) : (ys[0] ?? Infinity), la1 = big ? q(ys, .99) : (ys[ys.length - 1] ?? -Infinity);
  let ln0 = big ? q(xs, .01) : (xs[0] ?? Infinity), ln1 = big ? q(xs, .99) : (xs[xs.length - 1] ?? -Infinity);
  for (const c of bases) { la0 = Math.min(la0, c.lat); la1 = Math.max(la1, c.lat); ln0 = Math.min(ln0, c.lng); ln1 = Math.max(ln1, c.lng); }
  const W = 640, H = 340, pad = 18, kx = Math.cos((la0 + la1) / 2 * Math.PI / 180);

  const sc = Math.min((W - 2 * pad) / dx, (H - 2 * pad) / dy), ox = (W - dx * sc) / 2, oy = (H - dy * sc) / 2;

  for (const [la, ln, cor] of pts) { if (la < la0 || la > la1 || ln < ln0 || ln > ln1) continue; const k = cor || ''; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(`<circle cx="${X(ln)}" cy="${Y(la)}" r="2.4"/>`); }
  let grid = ''; for (let i = 1; i < 6; i++) grid += `M${(W / 6 * i).toFixed(0)} 0V${H}`; for (let i = 1; i < 4; i++) grid += `M0 ${(H / 4 * i).toFixed(0)}H${W}`;
  return `<svg class="scatter" viewBox="0 0 ${W} ${H}" role="img" aria-label="Distribuição geográfica dos clientes e das bases dos colaboradores"><path d="${grid}" style="stroke:var(--line);fill:none" stroke-width="1" stroke-dasharray="2 5"/>
    ${[...groups].map(([cor, cs]) => cor ? `<g fill="${esc(cor)}" fill-opacity=".9">${cs.join('')}</g>` : `<g style="fill:var(--muted)" fill-opacity=".5">${cs.join('')}</g>`).join('')}
    ${bases.map(c => `<rect x="${(+X(c.lng) - 6).toFixed(1)}" y="${(+Y(c.lat) - 6).toFixed(1)}" width="12" height="12" rx="3" style="fill:${esc(c.cor || 'var(--ink)')};stroke:var(--surface);stroke-width:2" data-tip="${esc((c.nome || c.codigo) + '\n' + (c.endereco || 'Base de saída'))}"/>`).join('')}</svg>`;
}

const sbMensagem = e => {
  const m = (e && e.message) || '';
  if (/invalid login/i.test(m)) return 'E-mail ou senha incorretos.';
  if (/not confirmed/i.test(m)) return 'Este e-mail ainda não foi confirmado. Abra o link enviado para ele.';
  if (/rate limit|too many/i.test(m) || (e && e.status === 429)) return 'Muitas tentativas em pouco tempo. Aguarde alguns minutos e tente de novo.';
  if (/fetch|network/i.test(m)) return 'Sem conexão com o banco de dados. Verifique a internet e tente de novo.';
  if (/different from the old/i.test(m)) return 'A nova senha precisa ser diferente da atual.';
  if (/not authorized/i.test(m)) return 'O Supabase não envia e-mail para este endereço sem um servidor de e-mail próprio. Crie a conta em Authentication → Users e inclua de novo aqui.';
  return m || 'Não foi possível concluir. Tente de novo.';

async function sbLogin(f) {

  sbManter = manter;
  try { Object.keys(localStorage).filter(k => k.startsWith('sb-')).forEach(k => localStorage.removeItem(k)); } catch (e) { /* ignora */ }
  const { data, error } = await st.sb.auth.signInWithPassword({ email, password: f.get('senha') });
  if (error) { const b = /invalid login/i.test(error.message || '') ? registraFalha(lg.emp, email) : 0; lgMsg(b ? msgBloqueio(b) : sbMensagem(error)); return; }
  limpaFalhas(lg.emp, email);

  await seguir();

async function sbPosLogin(user, manter) {

const hexOf = b => [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
async function derivar(txt, salt) {
  const k = await crypto.subtle.importKey('raw', new TextEncoder().encode(txt), 'PBKDF2', false, ['deriveBits']);
  return hexOf(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: new TextEncoder().encode(salt), iterations: 150000 }, k, 256));
}
async function segredo(txt) { const salt = hexOf(crypto.getRandomValues(new Uint8Array(16))); return { salt, hash: await derivar(txt, salt) }; }
const confere = async (txt, s) => !!s && (await derivar(txt, s.salt)) === s.hash;

function validaSenha(a, b) {
  const s = String(a);
  if (s.length < SENHA_MIN) return `A senha precisa ter ao menos ${SENHA_MIN} caracteres.`;
  if (!/[A-Za-zÀ-ÿ]/.test(s) || !/\d/.test(s)) return 'Use letras e números na senha.';
  if (SENHAS_FRACAS.includes(s.toLowerCase())) return 'Essa senha é muito comum. Escolha outra.';
  if (a !== b) return 'As duas senhas não são iguais.';
  return '';
}

async function moverDadosAntigos(emp) {
  const pre = emp.id + '_', cols = [...COLS_BASE], feitos = [];

const B32 = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';

    } else { const d = (await st.base.list(polColl())).find(x => x.id === 'politica'); if (d && d.data) Object.assign(p, d.data); }
  } catch (e) { /* fica o padrão */ }
  st.politica = p; return p;
}
async function salvaPolitica(p) {
  if (st.sb) { const { error } = await st.sb.from('empresas').update({ exige_2fa: !!p.exige2fa, inatividade_min: p.inatividadeMin }).eq('id', st.empresa.id); if (error) throw error; }
  else await st.base.set(polColl(), 'politica', p);
  st.politica = { ...st.politica, ...p }; audita('politica', `Duas etapas obrigatória: ${p.exige2fa ? 'sim' : 'não'} · inatividade: ${p.inatividadeMin || 'sem limite'} min`);
  iniciaInatividade();
}

/* ----- Duas etapas: estado, cadastro e conferência ----- */
async function sbFatores() { const { data, error } = await st.sb.auth.mfa.listFactors(); if (error) throw error; return { ok: (data.totp || []).filter(f => f.status === 'verified'), todos: data.all || [] }; }
async function sbPrecisaMfa() { try { const { data } = await st.sb.auth.mfa.getAuthenticatorAssuranceLevel(); return !!data && data.nextLevel === 'aal2' && data.currentLevel !== 'aal2'; } catch (e) { return false; } }
async function mfaAtivo() {
  if (st.sb) { try { return (await sbFatores()).ok.length > 0; } catch (e) { return false; } }
  return !!(st.usuario && st.usuario.mfa && st.usuario.mfa.on);
}
// Começa o cadastro: devolve { secret, qr (imagem), uri, factorId? }
async function mfaIniciar() {
  const e = st.empresa, login = (st.usuario && st.usuario.login) || '';
  if (st.sb) {
    const f = await sbFatores();
    for (const x of f.todos.filter(x => x.status === 'unverified')) await st.sb.auth.mfa.unenroll({ factorId: x.id }).catch(() => {});
    const { data, error } = await st.sb.auth.mfa.enroll({ factorType: 'totp', friendlyName: `RRM ${e.sigla} ${new Date().toLocaleDateString('pt-BR')}`, issuer: 'Roteirizador RRM' });
    if (error) throw error;
    // O Supabase devolve o SVG cru depois de "data:image/svg+xml;utf-8,": codificado, um "#" do SVG não corta a imagem
    const q = String(data.totp.qr_code || ''), svg = q.replace(/^data:image\/svg\+xml;[^,]*,/, '');
    return { factorId: data.id, secret: data.totp.secret, uri: data.totp.uri, qr: svg.trim().startsWith('<') ? 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg) : q || await qrDeUri(data.totp.uri) };
  }
  const secret = b32enc(crypto.getRandomValues(new Uint8Array(20)));
  const uri = `otpauth://totp/${encodeURIComponent(`Roteirizador RRM (${e.sigla}):${login}`)}?secret=${secret}&issuer=${encodeURIComponent('Roteirizador RRM')}&algorithm=SHA1&digits=6&period=30`;
  return { secret, uri, qr: await qrDeUri(uri) };
}
// Confirma o primeiro código. Sem o Supabase, devolve também os códigos de reserva (aparecem uma vez só)
async function mfaConfirmar(ini, code) {
  if (st.sb) {
    const { error } = await st.sb.auth.mfa.challengeAndVerify({ factorId: ini.factorId, code: somenteDigitos(code) });
    if (error) throw new Error(/invalid|expired/i.test(error.message || '') ? 'Código incorreto ou vencido. Confira a hora do celular e digite o código que aparece agora.' : sbMensagem(error));
    st.mfaAtivo = true; audita('mfa_ativada'); return { reservas: [] };
  }
  const ctr = await totpConfere(ini.secret, code); if (ctr < 0) throw new Error('Código incorreto ou vencido. Confira a hora do celular e digite o código que aparece agora.');
  const reservas = [...Array(8)].map(() => novoCodigo().slice(0, 9));
  const hashes = []; for (const r of reservas) hashes.push(await segredo(normCodigo(r)));
  st.usuario = { ...st.usuario, mfa: { on: true, secret: ini.secret, ult: ctr, reservas: hashes, em: Date.now() } };
  await salvarUsuario(st.empresa, st.usuario); st.mfaAtivo = true; audita('mfa_ativada');
  return { reservas };
}
async function mfaDesligar(code) {
  if (st.sb) {
    const f = await sbFatores(); if (!f.ok.length) return;
    const v = await st.sb.auth.mfa.challengeAndVerify({ factorId: f.ok[0].id, code: somenteDigitos(code) });
    if (v.error) throw new Error('Código incorreto. Digite o código que aparece agora no aplicativo.');
    for (const x of f.ok) { const { error } = await st.sb.auth.mfa.unenroll({ factorId: x.id }); if (error) throw error; }
    await st.sb.auth.refreshSession().catch(() => {});
  } else {
    if ((await totpConfere(st.usuario.mfa.secret, code)) < 0) throw new Error('Código incorreto. Digite o código que aparece agora no aplicativo.');
    const u = { ...st.usuario }; delete u.mfa; st.usuario = u; await salvarUsuario(st.empresa, u);
  }
  st.mfaAtivo = false; audita('mfa_desativada');
}
// Segunda etapa do login. u = usuário local (sem Supabase). Aceita também um código de reserva
async function mfaConferirLogin(code, u) {
  if (st.sb) {
    const f = await sbFatores(); if (!f.ok.length) return true;
    const { error } = await st.sb.auth.mfa.challengeAndVerify({ factorId: f.ok[0].id, code: somenteDigitos(code) });
    return !error;
  }
  const m = u.mfa; if (!m || !m.on) return true;
  const ctr = await totpConfere(m.secret, code, m.ult ?? -1);
  if (ctr >= 0) { await salvarUsuario(lg.emp, { ...u, mfa: { ...m, ult: ctr } }); return true; }
  const n = normCodigo(code);
  if (n.length >= 8) for (let i = 0; i < (m.reservas || []).length; i++) if (await confere(n, m.reservas[i])) {
    const res = m.reservas.slice(); res.splice(i, 1); await salvarUsuario(lg.emp, { ...u, mfa: { ...m, reservas: res } }); lg.ctx.usouReserva = res.length; return true;
  }
  return false;
}

/* ----- Aviso de privacidade (LGPD): o aceite fica registrado com a versão do texto ----- */
async function privacidadeAceita() {
  const u = st.usuario;
  if (st.sb) {
    try { const { data, error } = await st.sb.from('consentimentos').select('versao').eq('empresa_id', st.empresa.id).eq('user_id', u.id).eq('versao', PRIV.versao).maybeSingle(); if (error) { st.consSemTabela = true; return lerAceiteLocal(); } return !!data; }
    catch (e) { return lerAceiteLocal(); }
  }
  return !!(u.privacidade && u.privacidade.versao === PRIV.versao);
}
const chaveAceite = () => `rt1:privacidade:${st.empresa.id}:${st.usuario.id}`;
function lerAceiteLocal() { try { return localStorage.getItem(chaveAceite()) === PRIV.versao; } catch (e) { return false; } }
async function registraAceite() {

/* ----- Fim da sessão por inatividade. A atividade em qualquer aba conta para todas ----- */
const ATV_KEY = 'rt1:atividade';
let atvT = null, atvAviso = null, atvUlt = 0;
function marcaAtividade() { const t = Date.now(); if (t - atvUlt < 15000) return; atvUlt = t; try { localStorage.setItem(ATV_KEY, String(t)); } catch (e) { /* ignora */ } }
function ultimaAtividade() { try { return Math.max(atvUlt, +localStorage.getItem(ATV_KEY) || 0); } catch (e) { return atvUlt; } }
function iniciaInatividade() {
  clearInterval(atvT); atvT = null;
  const min = +st.politica.inatividadeMin || 0; if (!min) return;
  atvUlt = 0; marcaAtividade();
  if (!iniciaInatividade.ligado) { iniciaInatividade.ligado = true; ['pointerdown', 'keydown', 'wheel', 'touchstart'].forEach(ev => addEventListener(ev, marcaAtividade, { passive: true, capture: true })); }
  atvT = setInterval(() => {
    const ocioso = Date.now() - ultimaAtividade(), lim = min * 60000;
    if (ocioso >= lim) { clearInterval(atvT); atvT = null; encerrarPorInatividade(); }
    else if (ocioso >= lim - 60000 && !atvAviso) avisoInatividade(Math.ceil((lim - ocioso) / 1000));
    else if (atvAviso && ocioso < lim - 60000) fechaAvisoInatividade();
  }, 5000);
}
function avisoInatividade(seg) {
  const d = document.createElement('div'); d.id = 'atvAviso'; d.className = 'float'; d.setAttribute('role', 'alertdialog');
  d.innerHTML = `<b>Sua sessão vai terminar por inatividade</b><span class="muted">em <span id="atvSeg" class="num">${seg}</span> s, para proteger os dados.</span><button class="btn sm primary" type="button">Continuar conectado</button>`;
  document.body.append(d); atvAviso = { el: d, fim: Date.now() + seg * 1000, t: setInterval(() => { const s = $('#atvSeg'); if (s) s.textContent = Math.max(0, Math.ceil((atvAviso.fim - Date.now()) / 1000)); }, 1000) };
  d.querySelector('button').onclick = () => { atvUlt = 0; marcaAtividade(); fechaAvisoInatividade(); };
}
function fechaAvisoInatividade() { if (!atvAviso) return; clearInterval(atvAviso.t); atvAviso.el.remove(); atvAviso = null; }
async function encerrarPorInatividade() {
  fechaAvisoInatividade();
  audita('sessao_expirada', `${st.politica.inatividadeMin} min sem uso`);
  try { localStorage.setItem('rt1:saiuPorInatividade', '1'); } catch (e) { /* ignora */ }
  await sair(true);
}

async function sair(porInatividade) {

    toast((porInatividade ? 'A sessão não foi encerrada porque há alterações que não foram salvas: ' : 'Há alterações que não foram salvas: ') + (Save.err.message || 'erro'), 8000);
    if (porInatividade) iniciaInatividade();
    return;
  }
  if (!porInatividade) await Promise.race([audita('logout'), sleep(1500)]);
  if (st.sb) await st.sb.auth.signOut({ scope: 'local' }).catch(() => {});
  limparSessao(); location.reload();

async function init() {
  let db = null, user = null;
  if (window.claude && typeof window.claude.use === 'function') {
    try { [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]); } catch (e) { db = null; }
  }
  st.base = db ? CloudBackend(db) : LocalBackend;
  const recuperacao = /type=recovery/.test(location.hash), linkVencido = /error_description=/.test(location.hash);
  if (sbConfigurado()) { if (window.supabase) st.sb = criaSupabase(); else st.sbFalhou = true; }
  if (user && user.can) { try { const c = await user.can('data.write'); if (c === false) st.ro = true; } catch (e) { /* ok */ } }
  bindLogin();
  if (sbConfigurado()) {
    if (st.sb) {
      const { data: { session } } = await st.sb.auth.getSession();
      if (location.hash) history.replaceState(null, '', location.pathname + location.search);
      if (recuperacao && session) { lg.step = 'novaSenha'; renderLogin(); return; }
      const ses = lerSessao(), emp = ses && EMPRESAS.find(x => x.id === ses.emp);
      if (session && emp) {
        let u = null; try { u = await sbMembro(emp, session.user); } catch (e) { /* vai para o login */ }
        if (u && !u.trocarSenha) {
          st.empresa = emp; st.usuario = u; lg.emp = emp;
          if (await sbPrecisaMfa()) { lg.step = 'mfa'; lg.ctx = { login: u.login, seguir: () => liberar() }; renderLogin(); return; }
          await liberar(); return;
        }
      }
      if (session) await st.sb.auth.signOut({ scope: 'local' }).catch(() => {});
    }
    limparSessao(); renderLogin(); avisoSaida();
    if (linkVencido) lgMsg('Este link de senha já venceu ou foi usado. Peça um novo em “Esqueci minha senha”.');
    return;
  }
  const ses = lerSessao(), emp = ses && EMPRESAS.find(x => x.id === ses.emp);
  if (emp) {
    let u = null; try { u = (await usuariosDe(emp)).find(x => x.id === ses.uid); } catch (e) { /* vai para o login */ }
    if (u && !u.trocarSenha) { st.empresa = emp; st.usuario = u; await liberar(); return; }
  }
  limparSessao(); renderLogin(); avisoSaida();
}

  st.backend = st.sb ? SupabaseBackend(st.sb, e.id, ambPronto) : { kind: st.base.kind, list: c => st.base.list(e.id + '_' + c), set: (c, i, d) => st.base.set(e.id + '_' + c, i, d), del: (c, i) => st.base.del(e.id + '_' + c, i) };

  probeRoads();
  applyPanels();
  st.cli = new BucketStore('clientes'); st.col = new BucketStore('colaboradores'); st.amb = new BucketStore('ambientes'); st.imp = new BucketStore('importacoes');
  try { await Promise.all([st.cli.load(), st.col.load(), st.amb.load()]); }
  catch (e2) { toast('Não foi possível carregar os dados salvos: ' + (e2.message || e2.code || e2)); }
  try { await st.imp.load(); } catch (e2) { /* o histórico de importações não impede o uso do sistema */ }
  const ids = [...st.amb.values()].sort((a, b) => (b.alterado || 0) - (a.alterado || 0)).map(a => a.id);
  const first = ids.includes(st.lastAmb) ? st.lastAmb : ids[0];
  if (innerWidth < 900) st.panelL = false;
  if (innerWidth >= 1100) st.panelR = true;
  applyPanels();

  setScreen('home', 'hub');
  $('#loading').hidden = true;
  iniciaInatividade();
  // Os módulos carregam os próprios dados em segundo plano; o início se atualiza quando chegam
  for (const M of [window.RotasMod, window.CalMod, window.VerbaMod, window.PedMod]) if (M) M.iniciar().then(() => { if (st.screen === 'home') renderHome(); }).catch(() => {});
  addEventListener('beforeunload', ev => {
    for (const s of Save.stores) if (s.dirty.size) s.flush();
    if (geoQ.busy) { ev.preventDefault(); ev.returnValue = ''; } // a busca de coordenadas para se a página fechar
    if (st.sb && [...Save.stores].some(s => s.dirty.size || s.busy || s.t)) { ev.preventDefault(); ev.returnValue = ''; } // gravação no banco em andamento

}

const MES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
const MES_L = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
const nf2 = new Intl.NumberFormat('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const brl = v => 'R$ ' + nf2.format(v || 0);
const novoFiltro = () => ({ cid: new Set(), rg: new Set(), vend: new Set(), eq: new Set(), sg: new Set(), d: new Set(), w: new Set(), tempo: '', q: '' });
const RS = {
  bases: null, carregando: null, linhas: new Map(), memo: new Map(), poly: new Map(), estudos: new Map(),
  aba: 'geral', base: '', tab: 'vend', abertos: new Set(), aberto: '', f: novoFiltro(),
  cor: 'vend', verLinhas: true, verRegioes: false, verBases: true, hist: { de: '', ate: '', met: 'km' },
  cmp: { a: null, b: null }, nomes: new Map(), ultimo: null, maps: [], job: null, ligado: false

/* ---------- Períodos e datas ---------- */
const fmtPer = p => { const m = /^(\d{4})-(\d{2})$/.exec(p || ''); return m ? `${MES[+m[2] - 1]}/${m[1]}` : (p || 'sem período'); };
const fmtPerLongo = p => { const m = /^(\d{4})-(\d{2})$/.exec(p || ''); return m ? `${MES_L[+m[2] - 1]} de ${m[1]}` : (p || 'sem período'); };
const mesAtual = () => new Date().toISOString().slice(0, 7);
const pad2 = n => String(n).padStart(2, '0');
function deSerialExcel(n) { const d = new Date(Math.round((n - 25569) * 864e5)); return isNaN(d) ? '' : `${d.getUTCFullYear()}-${pad2(d.getUTCMonth() + 1)}-${pad2(d.getUTCDate())}`; }
function parseData(v) {
  if (v === null || v === undefined || v === '') return '';

  const s = String(v).trim(); let m;
  if ((m = /^(\d{1,2})[/.-](\d{1,2})[/.-](\d{2,4})/.exec(s))) { const y = +m[3] < 100 ? 2000 + +m[3] : +m[3]; return `${y}-${pad2(m[2])}-${pad2(m[1])}`; }
  if ((m = /^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s))) return `${m[1]}-${pad2(m[2])}-${pad2(m[3])}`;
  return '';
}
function parsePeriodo(v) {
  if (v === null || v === undefined || v === '') return '';
  if (typeof v === 'number') { if (v > 20000 && v < 80000) return deSerialExcel(v).slice(0, 7); if (v > 190001 && v < 210012) return `${Math.floor(v / 100)}-${pad2(v % 100)}`; return ''; }
  const s = norm(v).replace(/de/g, ''), t = String(v).trim(); let m;
  if ((m = /^(\d{4})[-/.]?(\d{1,2})$/.exec(t))) return `${m[1]}-${pad2(m[2])}`;
  if ((m = /^(\d{1,2})[-/.](\d{4})$/.exec(t))) return `${m[2]}-${pad2(m[1])}`;
  const d = parseData(t); if (d) return d.slice(0, 7);
  const i = MES.findIndex(x => s.startsWith(norm(x))); const y = /(\d{4}|\d{2})$/.exec(s);
  if (i >= 0 && y) return `${y[1].length === 2 ? '20' + y[1] : y[1]}-${pad2(i + 1)}`;
  return '';
}

/* ---------- Dados ---------- */
async function iniciar() {
  if (RS.bases) return;
  if (!RS.carregando) RS.carregando = (async () => { const b = new R.BucketStore('rotasbase'); try { await b.load(); } catch (e) { /* segue vazio */ } RS.bases = b; })();
  await RS.carregando;
}
const params = () => ({ ...DEF, ...((RS.bases && RS.bases.get(PARAM_ID)) || {}).p });
const psig = p => [p.fator, p.vel, p.jornada, p.tPadrao].join('|');
const basesList = () => (RS.bases ? [...RS.bases.values()].filter(b => b && b.id && b.id !== PARAM_ID) : []).sort((a, b) => String(b.periodo || '').localeCompare(String(a.periodo || '')) || (b.em || 0) - (a.em || 0));
const nomeVend = v => { if (RS.nomes.has(v)) return RS.nomes.get(v); const c = st.col && st.col.get(v); return c && c.nome ? c.nome : 'Vendedor ' + v; };
const corVend = (v, i) => { const c = st.col && st.col.get(v); return (c && c.cor) || E.PALETA[i % E.PALETA.length]; };
// Posição e dados do cliente: a base de clientes vale primeiro; a planilha completa o que faltar
function info(l) {
  const c = st.cli && st.cli.get(l.s), p = params();
  const lat = c && hasXY(c) ? c.lat : l.lat, lng = c && hasXY(c) ? c.lng : l.lng;
  return { nome: l.nm || (c && c.nome) || l.s, cidade: l.cid || (c && c.cidade) || '', lat, lng, ok: isNum(lat) && isNum(lng), t: isNum(l.t) ? l.t : c && isNum(c.t) ? c.t : p.tPadrao, sg: l.sg || '', rg: l.rg || '', eq: l.eq || '' };
}
async function linhasDe(id) {
  if (RS.linhas.has(id)) return RS.linhas.get(id).map;
  const s = new R.BucketStore('rotasl/' + id + '/b'); await s.load(); RS.linhas.set(id, s); return s.map;
}
const hashStr = s => { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36); };
const fatorMes = b => (b.porData ? 1 : 4 / Math.max(1, b.ciclo || 4));
const semanasCiclo = b => Math.max(1, b.ciclo || 4);

/* Rotas de uma base: vendedor × semana × dia, na ordem informada ou na melhor ordem calculada */
function calcula(b, linhas) {
  const p = params(), sig = psig(p) + '|' + (b.geoV || 0) + '|' + (st.cli ? st.cli.size : 0) + '|' + (st.col ? st.col.size : 0);
  const m0 = RS.memo.get(b.id); if (m0 && m0.sig === sig && m0.n === linhas.size) return m0.routes;
  const routes = new Map();
  for (const l of linhas.values()) for (const w of l.w || []) for (const d of l.d || []) {
    const k = `${l.v}|${w}|${d}`; let r = routes.get(k);
    if (!r) { r = { k, v: l.v, w, d, ls: [], vistos: new Set() }; routes.set(k, r); }
    if (!r.vistos.has(l.s)) { r.vistos.add(l.s); r.ls.push(l); }
  }
  for (const r of routes.values()) {
    delete r.vistos;
    const col = st.col && st.col.get(r.v), base = col && hasXY(col) ? { lat: col.lat, lng: col.lng } : null;
    const pts = r.ls.map(l => ({ l, ...info(l) })).filter(x => x.ok);
    let ord;
    if (pts.length && pts.every(x => isNum(x.l.q))) ord = pts.slice().sort((a, c) => a.l.q - c.l.q);
    else ord = E.sequence(base, pts).map(i => pts[i]);
    const m = E.routeMetrics(base, ord.map(x => ({ lat: x.lat, lng: x.lng, t: x.t })), { fator: p.fator, vel: p.vel, jornada: (col && col.jornada) || p.jornada });
    r.ord = ord; r.base = base; r.semXY = r.ls.length - pts.length;
    r.sig = hashStr(ord.map(x => x.l.s).join(',') + (base ? '@' + base.lat.toFixed(4) + ',' + base.lng.toFixed(4) : ''));
    const g = b.geo && b.geo[r.k];
    if (g && g.sig === r.sig) { const total = g.min + m.tAtend; r.m = { ...m, km: g.km, tDesl: g.min, total, ocup: m.jornada ? total / m.jornada : 0, real: true }; }
    else r.m = m;
  }
  RS.memo.set(b.id, { sig, n: linhas.size, routes });

}
// Resumo guardado na base: uma linha por rota, com as cidades, regiões e segmentos que ela atende
function resumo(b, routes) {
  const dic = { cid: [], rg: [], sg: [] }, ix = { cid: new Map(), rg: new Map(), sg: new Map() };
  const ide = (k, v) => { if (!v) return -1; let i = ix[k].get(v); if (i === undefined) { i = dic[k].length; dic[k].push(v); ix[k].set(v, i); } return i; };
  const rotas = [], eqC = {}, cliV = {};
  for (const r of routes.values()) {
    const cs = new Set(), rs = new Set(), ss = new Set();
    for (const l of r.ls) {
      const x = info(l); [['cid', x.cidade, cs], ['rg', x.rg, rs], ['sg', x.sg, ss]].forEach(([k, v, set]) => { const i = ide(k, v); if (i >= 0) set.add(i); });
      if (x.eq) { const e = eqC[r.v] || (eqC[r.v] = {}); e[x.eq] = (e[x.eq] || 0) + 1; }
      (cliV[r.v] || (cliV[r.v] = new Set())).add(l.s);
    }
    rotas.push([r.v, r.w, r.d, r.m.n, Math.round(r.m.km * 10) / 10, Math.round(r.m.tDesl), Math.round(r.m.tAtend), [...cs], [...rs], [...ss], r.m.jornada, r.m.real ? 1 : 0]);
  }
  const eqV = {}; for (const v in eqC) eqV[v] = Object.entries(eqC[v]).sort((a, c) => c[1] - a[1])[0][0];
  const cv = {}; for (const v in cliV) cv[v] = cliV[v].size;

function guardaResumo(b, routes) { const nb = { ...RS.bases.get(b.id), res: resumo(b, routes) }; RS.bases.put(b.id, nb); return nb; }

/* ---------- Filtros ---------- */
const temFiltroCliente = f => f.cid.size || f.rg.size || f.sg.size || f.tempo || f.q.trim();
const faixaTempo = (t, fx) => (fx === 'a' ? t <= 10 : fx === 'b' ? t > 10 && t <= 20 : fx === 'c' ? t > 20 && t <= 30 : fx === 'd' ? t > 30 : true);
function passaCliente(l, x, f) {
  if (f.cid.size && !f.cid.has(x.cidade)) return false;
  if (f.rg.size && !f.rg.has(x.rg)) return false;
  if (f.sg.size && !f.sg.has(x.sg)) return false;
  if (f.tempo && !faixaTempo(x.t, f.tempo)) return false;
  const q = norm(f.q); if (q && !(norm(l.s).includes(q) || norm(x.nome).includes(q))) return false;
  return true;
}
// Registros de rota (formato comum para a base aberta, o histórico e o estudo)
function recsVivos(b, routes, f = RS.f, eqV = {}) {
  const out = [], cf = temFiltroCliente(f);
  for (const r of routes.values()) {
    if (f.vend.size && !f.vend.has(r.v)) continue;
    if (f.d.size && !f.d.has(r.d)) continue;
    if (f.w.size && !f.w.has(r.w)) continue;
    if (f.eq.size && !f.eq.has(eqV[r.v] || '')) continue;
    const cli = []; let algum = false;
    for (const l of r.ls) { const x = info(l); if (!cf || passaCliente(l, x, f)) { cli.push(l.s); algum = true; } }
    if (cf && !algum) continue;
    out.push({ k: r.k, v: r.v, w: r.w, d: r.d, n: r.m.n, km: r.m.km, des: r.m.tDesl, at: r.m.tAtend, jor: r.m.jornada, cli, real: !!r.m.real, r });
  }
  return out;
}
function recsResumo(b, f = RS.f) {
  const res = b.res; if (!res) return [];
  const has = (set, arr, dic) => !set.size || arr.some(i => set.has(dic[i]));
  return res.rotas.filter(x => (!f.vend.size || f.vend.has(x[0])) && (!f.d.size || f.d.has(x[2])) && (!f.w.size || f.w.has(x[1])) && (!f.eq.size || f.eq.has(res.eqV[x[0]] || ''))
    && has(f.cid, x[7], res.dic.cid) && has(f.rg, x[8], res.dic.rg) && has(f.sg, x[9], res.dic.sg))
    .map(x => ({ v: x[0], w: x[1], d: x[2], n: x[3], km: x[4], des: x[5], at: x[6], jor: x[10] || params().jornada, real: !!x[11] }));
}
// Totais no mês. fm converte o ciclo da base em um mês de 4 semanas
function agrega(recs, fm, W, cliV) {
  const o = { rotas: recs.length, km: 0, des: 0, at: 0, n: 0, oc: 0, vend: new Set(), dias: new Set(), cli: new Set(), real: 0 };
  for (const r of recs) { o.km += r.km; o.des += r.des; o.at += r.at; o.n += r.n; o.oc += r.jor ? (r.des + r.at) / r.jor : 0; o.vend.add(r.v); o.dias.add(r.w + '|' + r.d); if (r.cli) r.cli.forEach(s => o.cli.add(s)); if (r.real) o.real++; }
  const p = params(), clientes = recs.some(r => r.cli) ? o.cli.size : [...o.vend].reduce((s, v) => s + ((cliV && cliV[v]) || 0), 0);
  return {
    rotas: recs.length, rotasMes: recs.length * fm, vendedores: o.vend.size, clientes, visitasMes: o.n * fm,
    kmCiclo: o.km, kmMes: o.km * fm, kmSemana: o.km / W, kmDia: recs.length ? o.km / recs.length : 0,
    desMes: o.des * fm, atMes: o.at * fm, horasMes: (o.des + o.at) * fm, horasDia: recs.length ? (o.des + o.at) / recs.length : 0,
    ocup: recs.length ? o.oc / recs.length : 0, custoMes: o.km * fm * p.valorKm, custoSemana: (o.km / W) * p.valorKm, custoDia: recs.length ? (o.km / recs.length) * p.valorKm : 0,

function eqDe(b, routes) { const eq = {}; for (const r of routes.values()) for (const l of r.ls) if (l.eq && !eq[r.v]) eq[r.v] = l.eq; return Object.keys(eq).length ? eq : (b.res && b.res.eqV) || {}; }

/* ---------- Importação (chamada pelo assistente de importação do app) ---------- */
function opcoesImport(wz) {
  if (!wz.rt) wz.rt = { nome: String(wz.arquivo || 'Base de roteiros').replace(/\.[^.]+$/, ''), periodo: mesAtual(), subst: true };
  const temPer = wz.map.periodo >= 0 || wz.map.data >= 0;
  return `<div class="fgrid"><label class="field"><span class="lbl">Nome da base</span><input type="text" id="rtNome" value="${esc(wz.rt.nome)}" maxlength="80"></label>
    <label class="field"><span class="lbl">Período${temPer ? ' (para linhas sem Período/Data)' : ''}</span><input type="month" id="rtPer" value="${esc(wz.rt.periodo)}"></label></div>
    <label class="chk"><input type="checkbox" id="rtSubst" ${wz.rt.subst ? 'checked' : ''}> Substituir a base que já existir no mesmo período</label>
    ${wz.map.dia >= 0 || wz.map.data >= 0 ? '' : '<div class="banner">Escolha a coluna de Dia (com Semana) ou de Data da visita: sem uma delas não há como montar as rotas.</div>'}`;
}
function ligaOpcoesImport(wz) {
  const n = $('#rtNome'), p = $('#rtPer'), s = $('#rtSubst');
  if (n) n.oninput = () => { wz.rt.nome = n.value; };
  if (p) p.onchange = () => { wz.rt.periodo = p.value || mesAtual(); };
  if (s) s.onchange = () => { wz.rt.subst = s.checked; };
}
async function importar(wz, cellOf) {
  if (st.ro) { toast('Ambiente em modo somente leitura'); return null; }
  if (!(wz.map.dia >= 0) && !(wz.map.data >= 0)) { toast('Escolha a coluna de Dia ou a de Data da visita'); return null; }
  await iniciar();
  const porPer = new Map(); let semSold = 0, semVend = 0, semDia = 0, semSemana = 0;
  for (const row of wz.rows) {
    const c = cellOf(row);
    const s = String(c('sold') ?? '').trim(), v = String(c('colab') ?? '').trim();
    if (!s) { semSold++; continue; } if (!v) { semVend++; continue; }
    const dt = wz.map.data >= 0 ? parseData(c('data')) : '';
    let per = wz.map.periodo >= 0 ? parsePeriodo(c('periodo')) : ''; if (!per && dt) per = dt.slice(0, 7); if (!per) per = wz.rt.periodo || mesAtual();
    let d, w;
    if (dt) { const D = new Date(dt + 'T12:00:00'); d = [((D.getDay() + 6) % 7) + 1]; w = [Math.min(5, Math.ceil(D.getDate() / 7))]; }
    else { d = parseDias(String(c('dia') ?? '').trim()); w = parseSemanas(c('semana'), 4); if (!w.length) { w = [1, 2, 3, 4]; semSemana++; } }
    if (!d.length) { semDia++; continue; }
    const l = { s, v, d, w };
    if (dt) l.dt = dt;
    for (const [k, campo] of [['eq', 'equipe'], ['rg', 'regiao'], ['sg', 'segmento'], ['cid', 'cidade'], ['nm', 'nome']]) { if (!(wz.map[campo] >= 0)) continue; const x = String(c(campo) ?? '').trim(); if (x) l[k] = x.slice(0, 80); }
    const t = numBR(c('t')); if (isNum(t) && t >= 0 && t < 600) l.t = t;
    const q = numBR(c('seq')); if (isNum(q)) l.q = q;
    const la = numBR(c('lat')), ln = numBR(c('lng')); if (isNum(la) && isNum(ln) && Math.abs(la) <= 90 && Math.abs(ln) <= 180 && (la || ln)) { l.lat = la; l.lng = ln; }
    if (!porPer.has(per)) porPer.set(per, []); porPer.get(per).push(l);
  }
  if (!porPer.size) { toast('Nenhuma linha válida: confira as colunas de SOLD, vendedor e dia.'); return null; }
  const lines = [], criadas = []; let total = 0; const semXY = new Set();
  for (const [per, ls] of [...porPer].sort((a, b) => a[0].localeCompare(b[0]))) {
    if (wz.rt.subst) for (const b of basesList().filter(x => x.periodo === per)) await excluiBase(b.id);
    const id = uid('rb'), porData = ls.some(l => l.dt);
    const meta = { id, nome: (porPer.size > 1 ? `${wz.rt.nome || 'Base'} · ${fmtPer(per)}` : wz.rt.nome || 'Base de roteiros').slice(0, 100), periodo: per, arquivo: wz.arquivo || '', usuario: (st.usuario && st.usuario.nome) || '', em: Date.now(), n: ls.length, porData, ciclo: Math.max(1, ...ls.flatMap(l => l.w)), geo: {} };
    const store = new R.BucketStore('rotasl/' + id + '/b');
    ls.forEach((l, i) => store.map.set('l' + i.toString(36).padStart(4, '0'), l));
    store.markAll(); store.sched(); RS.linhas.set(id, store);
    ls.forEach(l => { if (!info(l).ok) semXY.add(l.s); });

  }
  const ult = criadas[criadas.length - 1]; RS.base = ult.id; RS.aba = 'geral'; RS.f = novoFiltro();
  lines.push(['info', `${nf0.format(total)} linha(s) em ${criadas.length} base(s): ${criadas.map(b => `<b>${esc(fmtPer(b.periodo))}</b> (${nf0.format(b.n)})`).join(', ')}.`]);
  const ag = agrega(recsResumo(ult, novoFiltro()), fatorMes(ult), semanasCiclo(ult), ult.res.cliV);
  lines.push(['info', `${esc(fmtPer(ult.periodo))}: ${nf0.format(ag.vendedores)} vendedor(es), ${nf0.format(ag.clientes)} cliente(s), ${nf0.format(ag.rotas)} rota(s) no ${ult.porData ? 'mês' : 'ciclo'} e ${fkm(ag.kmMes)} km por mês (estimado).`]);
  if (semXY.size) lines.push(['', `${nf0.format(semXY.size)} cliente(s) sem coordenada (nem na base de clientes, nem na planilha) ficam fora do mapa e do KM: ${[...semXY].slice(0, 8).map(esc).join(', ')}${semXY.size > 8 ? '…' : ''}. Cadastre ou ajuste em Planejamento → Clientes.`]);
  if (semSemana) lines.push(['', `${nf0.format(semSemana)} linha(s) sem semana foram consideradas semanais (1234).`]);
  if (semDia + semVend + semSold) lines.push(['', `${nf0.format(semDia + semVend + semSold)} linha(s) ignoradas: ${[semSold && semSold + ' sem SOLD do cliente', semVend && semVend + ' sem vendedor', semDia && semDia + ' sem dia ou data'].filter(Boolean).join(', ')}.`]);
  if (st.rotasSemTabela) lines.push(['bad', 'O banco ainda não tem as tabelas de Rotas: a base vale só nesta sessão. Rode <b>supabase/migracao_05_rotas.sql</b> no Supabase.']);

  return { lines, reg: { linhas: wz.rows.length, alteracoes: total, novos: criadas.length, ignorados: semDia + semVend + semSold } };
}
async function excluiBase(id) {
  const s = RS.linhas.get(id) || new R.BucketStore('rotasl/' + id + '/b');
  try { if (!RS.linhas.has(id)) await s.load(); await s.destroy(); } catch (e) { /* segue */ }
  RS.linhas.delete(id); RS.memo.delete(id); RS.bases.del(id);
  if (RS.base === id) RS.base = '';
}

/* ---------- Mapas ---------- */

// Envoltória convexa (cadeia monótona) para desenhar a região de cada grupo
function envoltoria(pts) {
  const p = [...new Map(pts.map(x => [x[0].toFixed(5) + ',' + x[1].toFixed(5), x])).values()].sort((a, b) => a[1] - b[1] || a[0] - b[0]);
  if (p.length < 3) return p;
  const cr = (o, a, b) => (a[1] - o[1]) * (b[0] - o[0]) - (a[0] - o[0]) * (b[1] - o[1]);
  const lo = [], up = [];
  for (const x of p) { while (lo.length >= 2 && cr(lo[lo.length - 2], lo[lo.length - 1], x) <= 0) lo.pop(); lo.push(x); }
  for (const x of p.slice().reverse()) { while (up.length >= 2 && cr(up[up.length - 2], up[up.length - 1], x) <= 0) up.pop(); up.push(x); }
  return lo.slice(0, -1).concat(up.slice(0, -1));
}
const tipCli = (l, x, extra = '') => `<div class="tip"><b>${esc(x.nome)}</b><br><span class="t2">SOLD ${esc(l.s)} · ${esc(nomeVend(l.v))}${x.cidade ? ' · ' + esc(x.cidade) : ''}</span><br><span class="t2">${(l.d || []).map(d => DIA_C[d]).join('/')} · sem. ${(l.w || []).join(',')}${x.sg ? ' · ' + esc(x.sg) : ''} · ${nf0.format(x.t)} min</span>${extra}</div>`;
// Desenha rotas num mapa. rotas = [{k, v, d, w, ord:[{l, lat, lng}], base}], cor(r) define a cor
function desenhaRotas(m, rotas, cor, opts = {}) {
  const grupos = new Map(), feitos = new Set(), bounds = [], sel = opts.cliOk;
  const numeros = rotas.length <= 12;
  for (const r of rotas) {
    const c = cor(r), lls = [];
    r.ord.forEach((x, i) => {
      lls.push([x.lat, x.lng]); bounds.push([x.lat, x.lng]);
      if (feitos.has(x.l.s)) return; feitos.add(x.l.s);
      if (sel && !sel.has(x.l.s)) return;
      const destaque = opts.destaque && opts.destaque.has(x.l.s);
      const mk = new R.PinMarker([x.lat, x.lng], { renderer: m._rtPts, radius: 6, color: destaque ? '#18211D' : '#FFFFFF', weight: destaque ? 2.6 : 1.4, fillColor: c, fillOpacity: 0.95, label: numeros ? String(i + 1) : '', big: destaque });
      mk.bindTooltip(() => tipCli(x.l, info(x.l), destaque ? `<br><span class="t2"><b>${esc(opts.destaqueTxt || '')}</b></span>` : ''), { direction: 'top', offset: [0, -26] }).addTo(m);
      if (opts.grupo) { const g = opts.grupo(r, x); if (g) { if (!grupos.has(g.k)) grupos.set(g.k, { cor: g.cor, nome: g.nome, pts: [] }); grupos.get(g.k).pts.push([x.lat, x.lng]); } }
    });
    if (opts.linhas !== false && lls.length) {
      const poly = RS.poly.get(r.polyKey || r.k);
      if (poly) L.polyline(poly, { renderer: m._rtLin, color: c, weight: rotas.length > 12 ? 2.5 : 3.5, opacity: 0.85, interactive: false }).addTo(m);
      else {
        L.polyline(lls, { renderer: m._rtLin, color: c, weight: rotas.length > 12 ? 2 : 3, opacity: 0.8, interactive: false }).addTo(m);
        if (r.base) { const o = { renderer: m._rtLin, color: c, weight: 2, opacity: 0.55, dashArray: '4 6', interactive: false }; L.polyline([[r.base.lat, r.base.lng], lls[0]], o).addTo(m); L.polyline([lls[lls.length - 1], [r.base.lat, r.base.lng]], o).addTo(m); }
      }
    }
  }
  if (opts.regioes) for (const g of grupos.values()) {
    const h = envoltoria(g.pts); if (h.length < 3) continue;
    L.polygon(h, { renderer: m._rtLin, color: g.cor, weight: 2, opacity: 0.9, fillColor: g.cor, fillOpacity: 0.12, interactive: true }).bindTooltip(`<div class="tip"><b>${esc(g.nome)}</b><br><span class="t2">${nf0.format(g.pts.length)} cliente(s)</span></div>`, { sticky: true }).addTo(m);
  }
  if (opts.bases !== false) {
    const vistos = new Set();
    for (const r of rotas) {
      if (!r.base || vistos.has(r.v)) continue; vistos.add(r.v); bounds.push([r.base.lat, r.base.lng]);
      L.marker([r.base.lat, r.base.lng], { icon: L.divIcon({ className: '', html: `<div class="basem" style="background:${esc(opts.corBase ? opts.corBase(r) : cor(r))}">${ICON.home}</div>`, iconSize: [22, 22], iconAnchor: [11, 11] }), keyboard: false })
        .bindTooltip(`<div class="tip"><b>${esc(nomeVend(r.v))}</b><br><span class="t2">Base de saída</span></div>`, { direction: 'top', offset: [0, -10] }).addTo(m);
    }
  }
  return bounds;
}
