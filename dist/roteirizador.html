const dowDe = iso => ((dataDe(iso).getUTCDay() + 6) % 7) + 1; // 1 = segunda … 7 = domingo
const iniSemana = iso => somaDias(iso, -(dowDe(iso) % 7)); // domingo que abre a semana
const hojeIso = () => { const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; };
const fmtData = iso => { const [y, m, d] = String(iso).split('-'); return `${d}/${m}/${y}`; };
const fmtLonga = iso => `${DIA_L[dowDe(iso)].toLowerCase()}, ${+iso.slice(8)} de ${MES_L[+iso.slice(5, 7) - 1].toLowerCase()} de ${iso.slice(0, 4)}`;

/* ---------- Feriados nacionais ---------- */
function pascoa(y) { // algoritmo de Meeus/Jones/Butcher
  const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3);
  const h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
  const mes = Math.floor((h + l - 7 * m + 114) / 31), dia = ((h + l - 7 * m + 114) % 31) + 1;
  return `${y}-${pad2(mes)}-${pad2(dia)}`;
}
const memoFer = new Map();
// tipo: nacional (sem rota), facultativo (sem rota se a configuração mandar) e informativo (só aparece)
function feriadosAno(y) {
  if (memoFer.has(y)) return memoFer.get(y);
  const p = pascoa(y), m = new Map();
  const add = (iso, nome, tipo = 'nacional') => m.set(iso, { nome, tipo });
  add(`${y}-01-01`, 'Confraternização Universal');
  add(somaDias(p, -48), 'Carnaval', 'facultativo'); add(somaDias(p, -47), 'Carnaval', 'facultativo');
  add(somaDias(p, -46), 'Quarta-feira de Cinzas (até 14h)', 'informativo');
  add(somaDias(p, -2), 'Sexta-feira Santa');
  add(`${y}-04-21`, 'Tiradentes'); add(`${y}-05-01`, 'Dia do Trabalho');
  add(somaDias(p, 60), 'Corpus Christi', 'facultativo');
  add(`${y}-09-07`, 'Independência do Brasil'); add(`${y}-10-12`, 'Nossa Senhora Aparecida');
  add(`${y}-11-02`, 'Finados'); add(`${y}-11-15`, 'Proclamação da República');
  if (y >= 2024) add(`${y}-11-20`, 'Dia Nacional de Zumbi e da Consciência Negra');
  add(`${y}-12-24`, 'Véspera de Natal (após 14h)', 'informativo'); add(`${y}-12-25`, 'Natal'); add(`${y}-12-31`, 'Véspera de Ano-Novo (após 14h)', 'informativo');
  memoFer.set(y, m); return m;
}

/* ---------- Dados: configuração, categorias e eventos ---------- */
async function iniciar() {
  if (CS.store) return;
  if (!CS.carregando) CS.carregando = (async () => { const s = new R.BucketStore('calendario'); try { await s.load(); } catch (e) { /* segue vazio */ } CS.store = s; })();
  await CS.carregando;
}
const cfg = () => ({ ancora: '2026-11-16', facultSemRota: true, ...((CS.store && CS.store.get(CFG_ID)) || {}) });
const cats = () => { const c = CS.store && CS.store.get(CATS_ID); return c && Array.isArray(c.lista) && c.lista.length ? c.lista : CATS_PADRAO; };
const catDe = id => cats().find(c => c.id === id) || { id, nome: 'Outro', cor: '#7d8a84' };
const eventos = () => (CS.store ? [...CS.store.values()].filter(e => e && e.tipo === 'evento') : []);
const admin = () => !!(st.usuario && st.usuario.papel === 'admin' && !st.ro);
// Índice data → eventos, expandindo os de vários dias
function indiceEventos() {
  const idx = new Map();
  for (const e of eventos()) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(e.data || '')) continue;
    const fim = e.ate && e.ate >= e.data ? e.ate : e.data;
    for (let d = e.data, n = 0; d <= fim && n < 370; d = somaDias(d, 1), n++) { if (!idx.has(d)) idx.set(d, []); idx.get(d).push(e); }
  }
  return idx;
}

/* ---------- Semana do ciclo ----------
   Semanas de domingo a sábado (padrão do calendário brasileiro). A semana que contém a data de referência é a S1; daí em diante S2, S3, S4, S1…
   (e para trás também). Com ciclo de W semanas, a conta é a mesma com W no lugar de 4. */
function semana(iso, W = 4) {
  const seg = iniSemana(iso), ref = iniSemana(cfg().ancora);
  const n = Math.round((dataDe(seg) - dataDe(ref)) / 6048e5);
  return ((n % W) + W) % W + 1;
}
const quinzena = s4 => (s4 % 2 ? '1,3' : '2,4');

/* Informação de um dia: feriado, eventos, se tem rota e se é dia útil */
function diaInfo(iso, idx = indiceEventos()) {
  const dow = dowDe(iso), fer = feriadosAno(+iso.slice(0, 4)).get(iso) || null, evs = idx.get(iso) || [], c = cfg();
  const semRotaEv = evs.find(e => catDe(e.cat).semRota);
  const semRota = !!(fer && (fer.tipo === 'nacional' || (fer.tipo === 'facultativo' && c.facultSemRota))) || !!semRotaEv;
  const motivo = fer && fer.tipo !== 'informativo' && semRota ? fer.nome : semRotaEv ? semRotaEv.titulo || catDe(semRotaEv.cat).nome : '';
  return { iso, dow, s4: semana(iso, 4), fer, evs, semRota, motivo, util: dow <= 5 && !semRota, fds: dow >= 6 };
}
function diasDoMes(ym) {
  const [y, m] = ym.split('-').map(Number), idx = indiceEventos(), out = [];
  for (let d = 1; d <= new Date(Date.UTC(y, m, 0)).getUTCDate(); d++) out.push(diaInfo(`${y}-${pad2(m)}-${pad2(d)}`, idx));
  return out;
}
function resumoMes(ym) {
  const ds = diasDoMes(ym);
  return { uteis: ds.filter(d => d.util).length, sabados: ds.filter(d => d.dow === 6 && !d.semRota).length, semRota: ds.filter(d => d.semRota && !d.fds).length, feriados: ds.filter(d => d.fer && d.fer.tipo !== 'informativo'), eventos: ds.flatMap(d => d.evs.map(e => ({ ...e, dia: d.iso }))) };
}

/* ---------- Desenho de um mês: tabela com S1–S4 à esquerda e 1,3/2,4 à direita ----------
   marca(dia) pode devolver { cls, tip, txt } para destacar dias (a Verba usa isso no extrato). */
function mesHtml(y, m, opts = {}) {
  const ym = `${y}-${pad2(m + 1)}`, ds = diasDoMes(ym), hoje = hojeIso(), semHoje = iniSemana(hoje), grande = !!opts.grande;
  const primeiro = ds[0], cel = [];
  for (let i = 0; i < primeiro.dow % 7; i++) cel.push(null); // domingo é a primeira coluna
  ds.forEach(d => cel.push(d)); while (cel.length % 7) cel.push(null);
  const linhas = [];
  for (let i = 0; i < cel.length; i += 7) {
    const sem = cel.slice(i, i + 7), ref = sem.find(Boolean), seg = iniSemana(ref.iso), s4 = semana(ref.iso, 4);
    const tds = sem.map(d => {
      if (!d) return '<td class="cd vazio"></td>';
      const vis = d.evs.filter(e => !CS.ocultas.has(e.cat)), ferVis = d.fer && !CS.ocultas.has('__fer' + d.fer.tipo);
      const mk = opts.marca ? opts.marca(d) : null;
      const cls = ['cd', d.fds ? 'fds' : '', d.semRota && !d.fds ? 'semrota' : '', ferVis && d.fer.tipo !== 'informativo' ? 'fer' : '', d.iso === hoje ? 'hoje' : '', mk && mk.cls ? mk.cls : ''].filter(Boolean).join(' ');
      const tip = [fmtLonga(d.iso), `Semana S${d.s4} · quinzena ${quinzena(d.s4)}`, ferVis ? `${d.fer.nome}${d.fer.tipo === 'facultativo' ? ' (ponto facultativo)' : d.fer.tipo === 'informativo' ? '' : ' (feriado)'}` : '', ...vis.map(e => `${catDe(e.cat).nome}: ${e.titulo || ''}`), d.semRota && !d.fds ? 'Sem rota neste dia' : d.util ? 'Dia útil' : '', mk && mk.tip ? mk.tip : ''].filter(Boolean).join('\n');
      const pontos = vis.slice(0, 4).map(e => `<i style="background:${esc(catDe(e.cat).cor)}"></i>`).join('');
      const txt = grande ? `${ferVis ? `<span class="ev fer">${esc(d.fer.nome)}</span>` : ''}${vis.slice(0, 3).map(e => `<span class="ev" style="--c:${esc(catDe(e.cat).cor)}">${esc(e.titulo || catDe(e.cat).nome)}</span>`).join('')}${vis.length > 3 ? `<span class="muted">+${vis.length - 3}</span>` : ''}${mk && mk.txt ? mk.txt : ''}` : '';
      return `<td class="${cls}" data-cdia="${d.iso}" data-tip="${esc(tip)}" tabindex="0"><span class="dn">${+d.iso.slice(8)}</span>${grande ? txt : pontos ? `<span class="dots">${pontos}</span>` : ''}</td>`;
    }).join('');
    linhas.push(`<tr class="${seg === semHoje ? 'atual' : ''}"><td class="cw"><span class="wk" style="--c:${COR_SEM[s4]}">S${s4}</span></td>${tds}<td class="cw"><span class="qz q${s4 % 2 ? 13 : 24}">${quinzena(s4)}</span></td></tr>`);
  }
  const r = resumoMes(ym);
  return `<div class="cal-mes${grande ? ' grande' : ''}"><div class="cal-mh"><b>${MES_L[m]}${opts.comAno ? ' ' + y : ''}</b><span class="muted">${r.uteis} dias úteis${r.sabados ? ` · ${r.sabados} sáb.` : ''}${r.feriados.length ? ` · ${r.feriados.length} feriado${r.feriados.length > 1 ? 's' : ''}` : ''}</span></div>
    <table class="cal"><thead><tr><th class="cw" title="Semana do ciclo de 4 semanas">Sem.</th>${[7, 1, 2, 3, 4, 5, 6].map(d => `<th class="${d >= 6 ? 'fds' : ''}">${grande ? DIA_C[d] : DIA_C[d][0]}</th>`).join('')}<th class="cw" title="Quinzena: semanas 1 e 3 ou 2 e 4">Quinz.</th></tr></thead><tbody>${linhas.join('')}</tbody></table></div>`;
}

/* ---------- Página ---------- */
function legendaHtml() {
  const chipC = (id, cor, nome, extra = '') => `<button type="button" class="cal-leg${CS.ocultas.has(id) ? ' off' : ''}" data-cleg="${esc(id)}" aria-pressed="${!CS.ocultas.has(id)}"><i style="background:${esc(cor)}"></i>${esc(nome)}${extra}</button>`;
  return `<div class="cal-legs">${chipC('__fernacional', 'var(--feriado)', 'Feriado nacional')}${chipC('__ferfacultativo', 'color-mix(in srgb, var(--feriado) 45%, var(--surface))', 'Ponto facultativo')}${cats().map(c => chipC(c.id, c.cor, c.nome, c.semRota ? ' <span class="muted">· sem rota</span>' : '')).join('')}
    <span class="cal-leg fixa"><i class="hojei"></i>Hoje</span><span class="cal-leg fixa"><i class="fdsi"></i>Fim de semana</span></div>`;
}
function listaEventosHtml(ano) {
  const evs = eventos().filter(e => (e.data || '').startsWith(String(ano)) || (e.ate || '').startsWith(String(ano))).sort((a, b) => a.data.localeCompare(b.data));
  const fer = [...feriadosAno(ano)].filter(([, f]) => f.tipo !== 'informativo').sort((a, b) => a[0].localeCompare(b[0]));
  const hoje = hojeIso();
  return `<div class="cgrid">
    <div class="card"><div class="ch"><h2>Eventos de ${ano}</h2>${admin() ? '<button class="btn sm primary" type="button" data-ca="novo">Novo evento</button>' : ''}</div><div class="cb">${evs.length ? `<ul class="cal-lista">${evs.map(e => { const c = catDe(e.cat); return `<li class="${(e.ate || e.data) < hoje ? 'passou' : ''}"><span class="cl-d num">${fmtData(e.data).slice(0, 5)}${e.ate && e.ate !== e.data ? '–' + fmtData(e.ate).slice(0, 5) : ''}</span><span class="cl-c" style="--c:${esc(c.cor)}">${esc(c.nome)}</span><span class="cl-t"><b>${esc(e.titulo || c.nome)}</b>${e.desc ? `<span class="muted"> · ${esc(e.desc)}</span>` : ''}</span>${admin() ? `<span class="cl-a"><button class="btn sm" type="button" data-ca="edita" data-id="${esc(e.id)}">Editar</button></span>` : ''}</li>`; }).join('')}</ul>` : `<p class="muted" style="margin:0">Nenhum evento em ${ano}.${admin() ? ' Clique em um dia do calendário ou em “Novo evento”.' : ''}</p>`}</div></div>
    <div class="card"><div class="ch"><h2>Feriados nacionais de ${ano}</h2><span class="muted" style="font-size:12px">${cfg().facultSemRota ? 'pontos facultativos sem rota' : 'pontos facultativos com rota'}</span></div><div class="cb"><ul class="cal-lista">${fer.map(([iso, f]) => `<li class="${iso < hoje ? 'passou' : ''}"><span class="cl-d num">${fmtData(iso).slice(0, 5)}</span><span class="cl-c" style="--c:var(--feriado)">${f.tipo === 'facultativo' ? 'Facultativo' : 'Feriado'}</span><span class="cl-t">${esc(f.nome)} <span class="muted">· ${DIA_L[dowDe(iso)].toLowerCase()}</span></span></li>`).join('')}</ul></div></div></div>`;
}
let renderSeq = 0;
async function render(el = $('#homeView')) {
  if (!el || st.screen !== 'home' || st.homeSec !== 'cal') return;
  const seq = ++renderSeq; liga(el);
  if (!CS.store) { el.innerHTML = `<div class="page home">${R.migalha('Calendário')}<p class="muted">Carregando…</p></div>`; await iniciar(); if (seq !== renderSeq) return; }
  const keep = el.scrollTop, hoje = hojeIso(), di = diaInfo(hoje), prox = proximos(3);
  const ano = CS.ano, rAno = Array.from({ length: 12 }, (_, m) => resumoMes(`${ano}-${pad2(m + 1)}`));
  const uteisAno = rAno.reduce((s, r) => s + r.uteis, 0);
  const corpo = CS.vista === 'ano'
    ? `<div class="cal-ano">${Array.from({ length: 12 }, (_, m) => mesHtml(ano, m)).join('')}</div>`
    : `<div class="cal-unico">${mesHtml(ano, CS.mes, { grande: true, comAno: true })}</div>`;
  el.innerHTML = `<div class="page home cal-pg">${R.migalha('Calendário')}
    <div class="ph"><div><h1>Calendário</h1><p>Dias úteis, feriados, eventos da empresa e as semanas do ciclo de roteiro (S1 a S4 e quinzenas 1,3 e 2,4).</p></div>
      <div class="row">${admin() ? '<button class="btn" type="button" data-ca="cats">Categorias</button><button class="btn" type="button" data-ca="ciclo">Feriados</button><button class="btn primary" type="button" data-ca="novo">Novo evento</button>' : ''}</div></div>
    <div class="cal-hoje card"><div class="cb row">
      <span><b>Hoje</b> · ${esc(fmtLonga(hoje))}</span><span class="wk gr" style="--c:${COR_SEM[di.s4]}">Semana S${di.s4}</span><span class="qz gr q${di.s4 % 2 ? 13 : 24}">Quinzena ${quinzena(di.s4)}</span>
      ${di.motivo ? `<span class="pill bad">${esc(di.motivo)}</span>` : di.util ? '<span class="pill ok">dia útil</span>' : '<span class="pill idle">fim de semana</span>'}
      <span class="sp"></span>${prox.length ? `<span class="muted" style="font-size:12.5px">Próximo: <b>${esc(prox[0].titulo)}</b> em ${fmtData(prox[0].dia)}</span>` : ''}</div></div>
    <div class="cal-bar">
      <div class="row"><button class="btn sm" type="button" data-ca="ant" aria-label="Anterior">‹</button><b class="cal-tit num">${CS.vista === 'ano' ? ano : `${MES_L[CS.mes]} ${ano}`}</b><button class="btn sm" type="button" data-ca="prox" aria-label="Próximo">›</button><button class="btn sm" type="button" data-ca="hoje">Hoje</button></div>
      <div class="seg">${[['ano', 'Ano'], ['mes', 'Mês']].map(([v, t]) => `<button type="button" data-cvista="${v}" aria-pressed="${CS.vista === v}">${t}</button>`).join('')}</div>
      <span class="muted" style="font-size:12.5px">${ano}: ${uteisAno} dias úteis</span>
    </div>
    ${legendaHtml()}
    ${corpo}
    ${listaEventosHtml(ano)}
  </div>`;
  el.scrollTop = keep;
}
function proximos(n = 5) {
  const hoje = hojeIso(), out = [];
  for (const e of eventos()) if ((e.ate || e.data) >= hoje) out.push({ ...e, dia: e.data < hoje ? hoje : e.data, titulo: e.titulo || catDe(e.cat).nome });
  const y = +hoje.slice(0, 4);
  for (const yy of [y, y + 1]) for (const [iso, f] of feriadosAno(yy)) if (iso >= hoje && f.tipo !== 'informativo') out.push({ dia: iso, titulo: f.nome, cat: '__fer' });
  return out.sort((a, b) => a.dia.localeCompare(b.dia)).slice(0, n);
}

/* ---------- Formulários ---------- */
function diaForm(iso) {
  const d = diaInfo(iso), adm = admin();
  openModal(`<div class="dh"><div><h2>${esc(fmtLonga(iso))}</h2><div class="muted" style="font-size:12.5px">Semana S${d.s4} · quinzena ${quinzena(d.s4)} · ${d.semRota && !d.fds ? 'sem rota' : d.util ? 'dia útil' : 'fim de semana'}</div></div><button class="iconbtn" data-close aria-label="Fechar">${ICON.close}</button></div>
    <div class="db">${d.fer ? `<div class="banner ${d.fer.tipo === 'nacional' ? 'bad' : ''}">${esc(d.fer.nome)}${d.fer.tipo === 'facultativo' ? ' · ponto facultativo' : d.fer.tipo === 'informativo' ? '' : ' · feriado nacional'}</div>` : ''}
      ${d.evs.length ? `<ul class="cal-lista">${d.evs.map(e => { const c = catDe(e.cat); return `<li><span class="cl-c" style="--c:${esc(c.cor)}">${esc(c.nome)}</span><span class="cl-t"><b>${esc(e.titulo || c.nome)}</b>${e.desc ? `<br><span class="muted">${esc(e.desc)}</span>` : ''}${e.ate && e.ate !== e.data ? `<br><span class="muted">${fmtData(e.data)} a ${fmtData(e.ate)}</span>` : ''}</span>${adm ? `<span class="cl-a"><button class="btn sm" type="button" data-ca="edita" data-id="${esc(e.id)}">Editar</button></span>` : ''}</li>`; }).join('')}</ul>` : `<p class="muted" style="margin:0">Nenhum evento neste dia.</p>`}</div>
    <div class="df">${adm ? `<button class="btn primary" type="button" data-ca="novo" data-dia="${iso}">Incluir evento neste dia</button>` : ''}<button class="btn" type="button" data-close>Fechar</button></div>`, 'sm');
}
function eventoForm(ev = {}, dia) {
  if (!admin()) return;
  const e = { data: dia || hojeIso(), cat: cats()[0].id, ...ev }, novo = !ev.id;
  openModal(`<div class="dh"><h2>${novo ? 'Novo evento' : 'Editar evento'}</h2><button class="iconbtn" data-close aria-label="Fechar">${ICON.close}</button></div>
    <form id="calEv"><div class="db"><div class="fgrid">
      <label class="field"><span class="lbl">Categoria</span><select name="cat">${cats().map(c => `<option value="${esc(c.id)}"${c.id === e.cat ? ' selected' : ''}>${esc(c.nome)}${c.semRota ? ' (sem rota)' : ''}</option>`).join('')}</select></label>
      <label class="field"><span class="lbl">Título</span><input type="text" name="titulo" maxlength="80" value="${esc(e.titulo || '')}" placeholder="Ex.: Pagamento da verba de novembro" required></label>

      <label class="field"><span class="lbl">Até (opcional)</span><input type="date" name="ate" value="${esc(e.ate || '')}"><span class="hint">Para eventos de mais de um dia</span></label></div>
      <label class="field"><span class="lbl">Descrição (opcional)</span><textarea name="desc" maxlength="300">${esc(e.desc || '')}</textarea></label>
      <p class="muted" style="margin:0;font-size:12.5px">Categorias marcadas como “sem rota” (ex.: feriado local) tiram o dia do cálculo da Verba Indenizatória.</p></div>
    <div class="df">${novo ? '' : '<button class="btn danger" type="button" id="calDel">Excluir</button>'}<button class="btn" type="button" data-close>Cancelar</button><button class="btn primary" type="submit">Salvar</button></div></form>`, 'sm');
  $('#calEv').onsubmit = ev2 => {
    ev2.preventDefault(); const f = new FormData(ev2.target);

    const id = e.id || uid('ev');
    CS.store.put(id, { id, tipo: 'evento', cat: String(f.get('cat')), titulo: String(f.get('titulo')).trim(), data, ate: ate && ate !== data ? ate : '', desc: String(f.get('desc') || '').trim(), usuario: (st.usuario && st.usuario.nome) || '', em: Date.now() });
    R.audita('calendario', `${novo ? 'Incluiu' : 'Alterou'} ${catDe(f.get('cat')).nome}: ${f.get('titulo')} (${fmtData(data)})`);
    closeModal(); CS.ano = +data.slice(0, 4); render(); toast('Evento salvo');
  };
  const del = $('#calDel'); if (del) del.onclick = () => R.armButton(del, () => { CS.store.del(e.id); R.audita('calendario', `Excluiu ${e.titulo || ''} (${fmtData(e.data)})`); closeModal(); render(); toast('Evento excluído'); }, 'Confirmar exclusão');
}
function catsForm() {

  const desenha = () => {
    openModal(`<div class="dh"><h2>Categorias de evento</h2><button class="iconbtn" data-close aria-label="Fechar">${ICON.close}</button></div>

    <script>
/* Módulo Verba Indenizatória.

   Os dias vêm do Calendário: o dia da semana da rota, nas semanas do ciclo dela (S1 a S4, ou 1,3 e 2,4),
   tirando feriados e dias marcados como sem rota. Ex.: 50 km × R$ 0,90 numa segunda das semanas 2 e 4 = 2 dias → R$ 90,00.
   As rotas podem vir de uma base de Rotas ou de um estudo do Planejamento. Reembolsos somam e descontos subtraem.

(function () {
'use strict';

const { st, $, $$, esc, toast, openModal, closeModal, ICON, nf0, nf1, fkm, isNum, uid, numBR, hbars, vcols, saveFile, xlsxBlob, slug, dstamp, fdh, DIA_C, DIA_L, COR_SEM } = R;

const nf2 = new Intl.NumberFormat('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

const mesAtual = () => new Date().toISOString().slice(0, 7);
const pad2 = n => String(n).padStart(2, '0');
const fmtMes = ym => Rot.fmtPer(ym);
const ANEXO_MAX = 4;
const VS = { store: null, carregando: null, aba: 'calc', mes: mesAtual(), fonte: '', rac: '', vend: '', ext: '', lf: { vend: '', todos: false }, cmp: { a: { fonte: '', rac: '' }, b: { fonte: '', rac: '' } }, ligado: false };

/* ---------- Dados ---------- */
async function iniciar() {
  if (VS.store) return;

  await VS.carregando;
}
const todos = t => (VS.store ? [...VS.store.values()].filter(x => x && x.tipo === t) : []);
const racionais = () => todos('racional').sort((a, b) => String(a.nome).localeCompare(String(b.nome), 'pt-BR'));
const lancs = () => todos('lanc');
const apuracoes = () => todos('apuracao').sort((a, b) => b.mes.localeCompare(a.mes) || (b.em || 0) - (a.em || 0));
const valorRac = r => (r && r.kmL > 0 ? r.preco / r.kmL : 0) + ((r && r.cesta) || 0);
const formulaRac = r => `${brl4(r.preco)} ÷ ${nf1.format(r.kmL)} km/L + ${brl4(r.cesta)} = <b>${brl4(valorRac(r))} por km</b>`;

// Para bases importadas por data: o dia exato da rota (semana do mês × dia da semana)
function dataPorSemana(ym, w, d) {
  const [y, m] = ym.split('-').map(Number), fim = new Date(Date.UTC(y, m, 0)).getUTCDate();
  for (let dia = (w - 1) * 7 + 1; dia <= Math.min(w * 7, fim); dia++) { const iso = `${ym}-${pad2(dia)}`; if (Cal.dowDe(iso) === d) return iso; }

/* Cálculo de um mês para uma fonte e um racional */
async function calcular(fonteId, ym, racId) {

  const F = await Rot.carregaFonte(fonteId); if (!F) return null;
  const { b, routes } = F, recs = Rot.recsTodos(b, routes), vk = valorRac(rac), dias = Cal.diasDoMes(ym), W = Rot.semanasCiclo(b);
  const porV = new Map(), get = (v, nome) => { if (!porV.has(v)) porV.set(v, { v, nome: nome || Rot.nomeVend(v), km: 0, verba: 0, dias: new Set(), itens: [], perdidos: [], rotas: new Map(), reemb: 0, desc: 0, lancs: [] }); return porV.get(v); };
  for (const rec of recs) {
    const o = get(rec.v); const rk = rec.w + '|' + rec.d; if (!o.rotas.has(rk)) o.rotas.set(rk, { w: rec.w, d: rec.d, km: 0, n: 0, vezes: 0 }); const rr = o.rotas.get(rk); rr.km += rec.km; rr.n += rec.n;
    const ok = [], perd = [];

    else for (const x of dias) if (x.dow === rec.d && Cal.semana(x.iso, W) === rec.w) (x.semRota ? perd : ok).push(x);

    for (const x of ok) { o.itens.push({ iso: x.iso, d: rec.d, w: rec.w, km: rec.km, n: rec.n, valor: rec.km * vk, real: rec.real }); o.km += rec.km; o.verba += rec.km * vk; o.dias.add(x.iso); }
    for (const x of perd) o.perdidos.push({ iso: x.iso, motivo: x.motivo, km: rec.km });

    .sort((a, c) => String(a.nome).localeCompare(String(c.nome), 'pt-BR', { numeric: true }));
  const tot = linhas.reduce((t, o) => ({ km: t.km + o.km, verba: t.verba + o.verba, reemb: t.reemb + o.reemb, desc: t.desc + o.desc, liq: t.liq + o.liq, dias: t.dias + o.diasN, perd: t.perd + o.perdidos.length }), { km: 0, verba: 0, reemb: 0, desc: 0, liq: 0, dias: 0, perd: 0 });

}
const filtraVend = (c, v) => (v ? { ...c, linhas: c.linhas.filter(o => o.v === v), tot: c.linhas.filter(o => o.v === v).reduce((t, o) => ({ km: t.km + o.km, verba: t.verba + o.verba, reemb: t.reemb + o.reemb, desc: t.desc + o.desc, liq: t.liq + o.liq, dias: t.dias + o.diasN, perd: t.perd + o.perdidos.length }), { km: 0, verba: 0, reemb: 0, desc: 0, liq: 0, dias: 0, perd: 0 }) } : c);

/* ---------- Escolhas padrão ---------- */
function padroes() {
  const fl = Rot.fontesLista();

const kc = (k, v, s, cls = '') => `<div class="kc ${cls}"><span class="k">${k}</span><span class="v${String(v).includes('R$') ? ' rs' : ''}">${v}</span><span class="s">${s}</span></div>`;

/* ---------- Extrato de um vendedor ---------- */

// Imagem reduzida (lado maior até 1280 px, JPEG), para caber no banco sem perder a leitura
function comprime(file, max = 1280, q = 0.72) {
  return new Promise((res, rej) => {
    if (!/^image\//.test(file.type)) { rej(new Error('Envie imagens (JPG, PNG ou WEBP)')); return; }
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => { const s = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', q)); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Não foi possível ler a imagem')); };
    img.src = url;
  });
}

      <tr class="tot"><td>Total</td><td class="n">${a.tot.dias}</td><td class="n">${fkm(a.tot.km)}</td><td class="n">${brl(a.tot.verba)}</td><td class="n">${brl(a.tot.reemb)}</td><td class="n">${a.tot.desc ? '−' + brl(a.tot.desc) : '—'}</td><td class="n">${brl(a.tot.liq)}</td></tr></tbody></table></div></div>
    <div class="df"><button class="btn" type="button" data-va="apxls" data-id="${esc(a.id)}">Exportar (.xlsx)</button><button class="btn primary" type="button" data-close>Fechar</button></div>`, 'lg');
}

/* ---------- Comparativo: mesmo KM com racionais diferentes, ou KM diferentes com o mesmo racional ---------- */
function abaCmp(A, B) {
  const c = VS.cmp, lado = k => `<div class="cmpl"><div class="cmph"><i class="sw" style="background:var(--cmp-${k})"></i><b>Lado ${k.toUpperCase()}</b></div>
    <label class="field"><span class="lbl">Rotas de</span><select data-vc="${k}.fonte">${Rot.fonteOpts(c[k].fonte)}</select></label>
    <label class="field"><span class="lbl">Racional</span><select data-vc="${k}.rac">${racOpts(c[k].rac)}</select></label></div>`;
  const ctl = `<div class="card"><div class="cb rt-cmpctl"><label class="field" style="max-width:180px"><span class="lbl">Mês</span><input type="month" data-vf="mes" value="${esc(VS.mes)}"></label>${lado('a')}<button class="btn sm" type="button" data-va="cmptroca" title="Trocar os lados">⇄</button>${lado('b')}</div>
    <div class="cb row" style="padding-top:0"><span class="muted" style="font-size:12.5px">Atalhos:</span><button class="btn sm" type="button" data-va="mesmokm">Mesmos KM, outro racional</button><button class="btn sm" type="button" data-va="mesmorac">Mesmo racional, outros KM</button></div></div>`;
  if (!A || !B) return ctl + '<div class="card"><div class="cb muted">Escolha as rotas e os racionais dos dois lados.</div></div>';
  const vs = new Map(); for (const o of A.linhas) vs.set(o.v, o.nome); for (const o of B.linhas) if (!vs.has(o.v)) vs.set(o.v, o.nome);
  const sinal = (x, f) => { const z = f(Math.abs(x)) === f(0); return `<span class="${z ? '' : x < 0 ? 'down' : 'up'}">${z ? '' : x > 0 ? '+' : '−'}${f(Math.abs(x))}</span>`; };
  const rows = [...vs].map(([v, n]) => { const a = A.linhas.find(o => o.v === v) || { km: 0, verba: 0, diasN: 0 }, b = B.linhas.find(o => o.v === v) || { km: 0, verba: 0, diasN: 0 }; return { v, n, a, b }; }).sort((x, y) => Math.abs(y.b.verba - y.a.verba) - Math.abs(x.b.verba - x.a.verba));
  const pct = (x, y) => (x ? `${nf0.format(Math.round((y - x) / x * 100))}%` : '—');
  const card = (t, a, b, f, menor = true) => `<div class="kc"><span class="k">${t}</span><span class="v rs">${f(a)} <span class="muted">→</span> ${f(b)}</span><span class="s">${sinal(b - a, f)} · ${pct(a, b)}</span></div>`;
  const mx = Math.max(1, ...rows.flatMap(r => [r.a.verba, r.b.verba]));
  return `${ctl}
    <div class="kgrid k4">${card('KM no mês', A.tot.km, B.tot.km, fkm)}${card('Racional por km', A.vk, B.vk, brl4)}${card('Verba', A.tot.verba, B.tot.verba, brl)}${card('Total a pagar', A.tot.liq, B.tot.liq, brl)}</div>
    <p class="muted" style="margin:0;font-size:12.5px">A: ${esc(Rot.nomeFonte(A.b.id))} · ${esc(A.rac.nome)} (${formulaRac(A.rac)}). B: ${esc(Rot.nomeFonte(B.b.id))} · ${esc(B.rac.nome)} (${formulaRac(B.rac)}). Diferença = B − A; verde = B custa menos.</p>
    <div class="cgrid"><div class="card"><div class="ch"><h2>Verba por vendedor</h2><span class="legend-row"><span class="li"><i class="sw" style="background:var(--cmp-a)"></i>A</span><span class="li"><i class="sw" style="background:var(--cmp-b)"></i>B</span></span></div><div class="cb"><div class="cmpbars">
      ${rows.slice(0, 14).map(r => `<div class="cb2"><span class="cn">${esc(r.n)}</span><div class="cr" data-tip="${esc(`${r.n}\nA: ${fkm(r.a.km)} km · ${brl(r.a.verba)}\nB: ${fkm(r.b.km)} km · ${brl(r.b.verba)}`)}"><span class="ct"><i style="width:${r.a.verba / mx * 100}%;background:var(--cmp-a)"></i></span><span class="cv num">${brl(r.a.verba)}</span><span class="ct"><i style="width:${r.b.verba / mx * 100}%;background:var(--cmp-b)"></i></span><span class="cv num">${brl(r.b.verba)}</span></div></div>`).join('')}</div></div></div>
    <div class="card"><div class="ch"><h2>Dias do mês</h2></div><div class="cb stack"><div class="dbrow"><div><div class="lbl">Dias úteis de ${esc(fmtMes(VS.mes))}</div><b class="num">${A.res.uteis}</b> <span class="muted">${diasMesTxt(A.res)}</span></div></div>
      <div class="dbrow"><div><div class="lbl">Dias calculados</div><span class="num">A: <b>${nf0.format(A.tot.dias)}</b> · B: <b>${nf0.format(B.tot.dias)}</b></span></div></div>
      <div class="dbrow"><div><div class="lbl">Reembolsos e descontos</div><span class="muted">São os mesmos dos dois lados (lançados por vendedor e mês): ${brl(A.tot.reemb)} e −${brl(A.tot.desc)}</span></div></div></div></div></div>
    <div class="tblwrap"><table class="t"><thead><tr><th>Vendedor</th><th class="n">KM A</th><th class="n">KM B</th><th class="n">Δ KM</th><th class="n">Dias A</th><th class="n">Dias B</th><th class="n">Verba A</th><th class="n">Verba B</th><th class="n">Δ verba</th><th class="n">Δ %</th></tr></thead><tbody>
      ${rows.map(r => `<tr><td><b>${esc(r.n)}</b></td><td class="n">${fkm(r.a.km)}</td><td class="n">${fkm(r.b.km)}</td><td class="n">${sinal(r.b.km - r.a.km, fkm)}</td><td class="n">${r.a.diasN}</td><td class="n">${r.b.diasN}</td><td class="n">${brl(r.a.verba)}</td><td class="n">${brl(r.b.verba)}</td><td class="n">${sinal(r.b.verba - r.a.verba, brl)}</td><td class="n">${pct(r.a.verba, r.b.verba)}</td></tr>`).join('')}
      <tr class="tot"><td>Total</td><td class="n">${fkm(A.tot.km)}</td><td class="n">${fkm(B.tot.km)}</td><td class="n">${sinal(B.tot.km - A.tot.km, fkm)}</td><td class="n">${A.tot.dias}</td><td class="n">${B.tot.dias}</td><td class="n">${brl(A.tot.verba)}</td><td class="n">${brl(B.tot.verba)}</td><td class="n">${sinal(B.tot.verba - A.tot.verba, brl)}</td><td class="n">${pct(A.tot.verba, B.tot.verba)}</td></tr></tbody></table></div>`;
}

/* ---------- Racionais ---------- */
function abaRac() {
  const l = racionais();
  return `<div class="row" style="justify-content:space-between"><p class="muted" style="margin:0;max-width:80ch">Racional por km = preço médio do combustível pesquisado ÷ KM por litro + cesta de serviço (pedágio e manutenção, em R$ por km). Cadastre um por tipo de veículo, região ou período para comparar.</p><button class="btn primary" type="button" data-va="racnovo"${admin() ? '' : ' disabled'}>Novo racional</button></div>
    <div class="tblwrap"><table class="t"><thead><tr><th>Racional</th><th class="n">Combustível (R$/L)</th><th class="n">KM por litro</th><th class="n">Combustível por km</th><th class="n">Cesta (R$/km)</th><th class="n">Racional (R$/km)</th><th>Vale desde</th><th></th></tr></thead><tbody>
      ${l.map(r => `<tr><td class="wrap"><b>${esc(r.nome)}</b>${r.obs ? `<div class="muted" style="font-size:12px">${esc(r.obs)}</div>` : ''}</td><td class="n">${brl4(r.preco)}</td><td class="n">${nf1.format(r.kmL)}</td><td class="n">${brl4(r.preco / r.kmL)}</td><td class="n">${brl4(r.cesta)}</td><td class="n"><b>${brl4(valorRac(r))}</b></td><td>${r.desde ? esc(fmtMes(r.desde)) : '—'}</td><td class="n">${admin() ? `<button class="btn sm" type="button" data-va="racedita" data-id="${esc(r.id)}">Editar</button>` : ''}</td></tr>`).join('') || '<tr><td colspan="8" class="muted">Nenhum racional cadastrado.</td></tr>'}</tbody></table></div>`;
}
function racForm(r0 = {}) {
  if (!admin()) return;
  const r = { nome: '', preco: 6.2, kmL: 10, cesta: 0.28, desde: '', obs: '', ...r0 }, novo = !r0.id;
  openModal(`<div class="dh"><h2>${novo ? 'Novo racional' : 'Editar racional'}</h2><button class="iconbtn" data-close aria-label="Fechar">${ICON.close}</button></div>
    <form id="racForm"><div class="db"><div class="fgrid">
      <label class="field"><span class="lbl">Nome</span><input type="text" name="nome" maxlength="60" value="${esc(r.nome)}" placeholder="Ex.: Carro 1.0 · novembro" required></label>
      <label class="field"><span class="lbl">Combustível (R$ por litro)</span><input type="text" name="preco" inputmode="decimal" value="${esc(nf4.format(r.preco))}" required><span class="hint">Preço médio pesquisado</span></label>
      <label class="field"><span class="lbl">KM por litro</span><input type="text" name="kmL" inputmode="decimal" value="${esc(nf1.format(r.kmL))}" required></label>
      <label class="field"><span class="lbl">Cesta de serviço (R$ por km)</span><input type="text" name="cesta" inputmode="decimal" value="${esc(nf4.format(r.cesta))}" required><span class="hint">Pedágio e manutenção</span></label>
      <label class="field"><span class="lbl">Vale desde (opcional)</span><input type="month" name="desde" value="${esc(r.desde || '')}"></label></div>
      <label class="field"><span class="lbl">Observação</span><input type="text" name="obs" maxlength="160" value="${esc(r.obs || '')}" placeholder="Fonte da pesquisa de preço, tipo de veículo…"></label>
      <div class="vb-form" id="racPrev"></div></div>
    <div class="df">${novo ? '' : '<button class="btn danger" type="button" id="racDel">Excluir</button>'}<button class="btn" type="button" data-close>Cancelar</button><button class="btn primary" type="submit">Salvar</button></div></form>`, 'sm');
  const f = $('#racForm'), le = () => ({ preco: numBR(f.preco.value), kmL: numBR(f.kmL.value), cesta: numBR(f.cesta.value) });
  const prev = () => { const x = le(); $('#racPrev').innerHTML = isNum(x.preco) && x.kmL > 0 && isNum(x.cesta) ? formulaRac(x) + ` · 50 km por dia em 2 dias no mês = ${brl(50 * valorRac(x) * 2)}` : 'Preencha os valores'; };
  f.oninput = prev; prev();
  f.onsubmit = ev => {
    ev.preventDefault(); const x = le();
    if (!isNum(x.preco) || x.preco <= 0 || !(x.kmL > 0) || !isNum(x.cesta) || x.cesta < 0) { toast('Confira os valores'); return; }
    const id = r.id || uid('vr'), rec = { id, tipo: 'racional', nome: f.nome.value.trim(), ...x, desde: f.desde.value || '', obs: f.obs.value.trim(), em: Date.now() };
    VS.store.put(id, rec); R.audita('verba', `${novo ? 'Criou' : 'Alterou'} o racional ${rec.nome}: ${brl4(valorRac(rec))}/km`);
    if (!VS.rac) VS.rac = id; closeModal(); render(); toast('Racional salvo');
  };
  const del = $('#racDel'); if (del) del.onclick = () => R.armButton(del, () => { VS.store.del(r.id); R.audita('verba', `Excluiu o racional ${r.nome}`); closeModal(); render(); }, 'Confirmar exclusão');
}

/* ---------- Exportação ---------- */
function exportaCalc(c, v) {
  const cc = filtraVend(c, v);
  const resumo = cc.linhas.map(o => ({ Vendedor: o.nome, Codigo: o.v, 'Rotas por ciclo': o.rotas.size, 'Dias calculados': o.diasN, 'KM no mes': +o.km.toFixed(1), 'Racional R$/km': +c.vk.toFixed(4), Verba: o.verba, Reembolso: cent(o.reemb), Desconto: cent(o.desc), Total: o.liq }));
  const extrato = cc.linhas.flatMap(o => o.itens.map(i => ({ Vendedor: o.nome, Codigo: o.v, Data: Cal.fmtData(i.iso), Dia: DIA_L[i.d], Semana: 'S' + Cal.semana(i.iso), Quinzena: Cal.quinzena(Cal.semana(i.iso)), KM: +i.km.toFixed(1), Verba: cent(i.valor) })));
  const lan = cc.linhas.flatMap(o => o.lancs.map(l => ({ Vendedor: o.nome, Codigo: o.v, Tipo: l.natureza, Data: l.data ? Cal.fmtData(l.data) : '', Motivo: l.motivo, Referencia: l.ref || '', Valor: l.natureza === 'reembolso' ? l.valor : -l.valor })));
  saveFile(`verba_${slug(fmtMes(c.ym))}${v ? '_' + slug(v) : ''}_${dstamp()}.xlsx`, xlsxBlob([['Resumo', resumo], ['Extrato de KM', extrato], ['Reembolsos e descontos', lan], ['Racional', [{ Racional: c.rac.nome, 'Combustivel R$/L': c.rac.preco, 'KM por litro': c.rac.kmL, 'Cesta R$/km': c.rac.cesta, 'Racional R$/km': +c.vk.toFixed(4), 'Rotas de': Rot.nomeFonte(c.b.id), Mes: fmtMes(c.ym), 'Dias uteis': c.res.uteis }]]]));
  R.audita('exportacao', `Verba de ${fmtMes(c.ym)}${v ? ' · ' + v : ''}`);
}

/* ---------- Importação de reembolsos e descontos (pelo assistente do app) ---------- */
function opcoesImport(wz) {
  if (!wz.vb) wz.vb = { natureza: wz.natPadrao || 'reembolso', mes: VS.mes };
  return `<div class="fgrid"><label class="field"><span class="lbl">Tipo, quando a planilha não tiver a coluna</span><select id="vbNat"><option value="reembolso"${wz.vb.natureza === 'reembolso' ? ' selected' : ''}>Reembolso</option><option value="desconto"${wz.vb.natureza === 'desconto' ? ' selected' : ''}>Desconto</option></select></label>
    <label class="field"><span class="lbl">Mês, quando a planilha não tiver Mês nem Data</span><input type="month" id="vbMes" value="${esc(wz.vb.mes)}"></label></div>`;
}
function ligaOpcoesImport(wz) { const n = $('#vbNat'), m = $('#vbMes'); if (n) n.onchange = () => { wz.vb.natureza = n.value; }; if (m) m.onchange = () => { wz.vb.mes = m.value || VS.mes; }; }
const parseDataBR = v => { if (typeof v === 'number' && v > 20000 && v < 80000) { const d = new Date(Math.round((v - 25569) * 864e5)); return d.toISOString().slice(0, 10); } const s = String(v || '').trim(); let m; if ((m = /^(\d{1,2})[/.-](\d{1,2})[/.-](\d{2,4})/.exec(s))) return `${+m[3] < 100 ? 2000 + +m[3] : m[3]}-${pad2(m[2])}-${pad2(m[1])}`; if ((m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s))) return m[0]; return ''; };
const parseMes = v => { const d = parseDataBR(v); if (d) return d.slice(0, 7); const s = String(v || '').trim(); let m; if ((m = /^(\d{1,2})[/.-](\d{4})$/.exec(s))) return `${m[2]}-${pad2(m[1])}`; if ((m = /^(\d{4})[-/.](\d{1,2})$/.exec(s))) return `${m[1]}-${pad2(m[2])}`; return ''; };
async function importar(wz, cellOf) {
  if (!admin()) { toast('Só o administrador inclui reembolsos e descontos'); return null; }
  await iniciar();
  let n = 0, ign = 0, nR = 0, nD = 0, soma = 0;
  for (const row of wz.rows) {
    const c = cellOf(row), vend = String(c('vend') ?? '').trim(), valor = numBR(c('valor'));
    if (!vend || !isNum(valor) || valor === 0) { ign++; continue; }
    const t = R.norm(c('tipo')), natureza = /desc|debit|abat/.test(t) ? 'desconto' : /reemb|credit|ressarc/.test(t) ? 'reembolso' : valor < 0 ? 'desconto' : wz.vb.natureza;
    const data = parseDataBR(c('data')), mes = parseMes(c('mes')) || (data ? data.slice(0, 7) : '') || wz.vb.mes;
    const id = uid('vl');
    VS.store.put(id, { id, tipo: 'lanc', natureza, vend, vendNome: Rot.nomeVend(vend), mes, data, valor: cent(Math.abs(valor)), motivo: String(c('motivo') ?? '').trim().slice(0, 120) || (natureza === 'reembolso' ? 'Reembolso' : 'Desconto'), ref: String(c('ref') ?? '').trim().slice(0, 160), anexos: [], usuario: (st.usuario && st.usuario.nome) || '', em: Date.now(), importado: wz.arquivo || '' });
    n++; soma += Math.abs(valor); if (natureza === 'reembolso') nR++; else nD++;
  }
  const lines = [['info', `${nf0.format(n)} lançamento(s) importados: ${nR} reembolso(s) e ${nD} desconto(s), somando ${brl(soma)}.`]];
  if (ign) lines.push(['', `${nf0.format(ign)} linha(s) ignoradas por falta de vendedor ou valor.`]);
  if (st.verbaSemTabela) lines.push(['bad', 'O banco ainda não tem as tabelas da Verba: os lançamentos valem só nesta sessão. Rode <b>supabase/migracao_06_calendario_verba.sql</b>.']);
  R.audita('verba', `Importou ${n} lançamento(s) de ${wz.arquivo || 'planilha'}`);
  VS.aba = nD > nR ? 'desc' : 'reemb';
  return { lines, reg: { linhas: wz.rows.length, alteracoes: n, novos: n, ignorados: ign } };
}

/* ---------- Página ---------- */
let renderSeq = 0;
async function render(el = $('#homeView')) {
  if (!el || st.screen !== 'home' || st.homeSec !== 'verba') return;
  const seq = ++renderSeq; liga(el);
  if (!VS.store) { el.innerHTML = `<div class="page home">${R.migalha('Verba Indenizatória')}<p class="muted">Carregando…</p></div>`; await Promise.all([iniciar(), Rot.iniciar(), Cal.iniciar()]); if (seq !== renderSeq) return; }
  padroes();
  const keep = el.scrollTop;
  const ABAS = [['calc', 'Cálculo'], ['ext', 'Extrato'], ['reemb', 'Reembolsos'], ['desc', 'Descontos'], ['hist', 'Histórico'], ['cmp', 'Comparativo'], ['rac', 'Racionais']];
  const topo = `${R.migalha('Verba Indenizatória')}<div class="ph"><div><h1>Verba Indenizatória</h1><p>KM das rotas × racional × dias de rota no mês, com reembolsos, descontos, extrato por vendedor e histórico.</p></div></div>
    ${st.verbaSemTabela ? '<div class="banner bad">O banco ainda não tem as tabelas da Verba e do Calendário: o que for salvo vale só nesta sessão. Rode <b>supabase/migracao_06_calendario_verba.sql</b> no Supabase.</div>' : ''}
    ${admin() ? '' : '<div class="banner info">Somente leitura: só o administrador do ambiente altera racionais, lançamentos e apurações.</div>'}
    <nav class="rt-abas seg" aria-label="Visões">${ABAS.map(([k, t]) => `<button type="button" data-vaba="${k}" aria-pressed="${VS.aba === k}">${t}</button>`).join('')}</nav>`;
  let corpo = '';
  const precisa = VS.aba === 'calc' || VS.aba === 'ext' || VS.aba === 'cmp';
  if (precisa && vazio()) corpo = vazio();
  else if (VS.aba === 'calc' || VS.aba === 'ext') {
    el.innerHTML = `<div class="page home verba">${topo}<p class="muted">Calculando…</p></div>`;
    const c = await calcular(VS.fonte, VS.mes, VS.rac); if (seq !== renderSeq) return;
    VS.ult = c;
    corpo = !c ? '<div class="card"><div class="cb muted">Não foi possível calcular com estas escolhas.</div></div>' : VS.aba === 'calc' ? abaCalc(c) : abaExtrato(c);
  } else if (VS.aba === 'cmp') {
    el.innerHTML = `<div class="page home verba">${topo}<p class="muted">Calculando os dois lados…</p></div>`;
    const [A, B] = await Promise.all([calcular(VS.cmp.a.fonte, VS.mes, VS.cmp.a.rac), calcular(VS.cmp.b.fonte, VS.mes, VS.cmp.b.rac)]); if (seq !== renderSeq) return;
    corpo = abaCmp(A, B);
  }
  else if (VS.aba === 'reemb') corpo = abaLanc('reembolso');
  else if (VS.aba === 'desc') corpo = abaLanc('desconto');
  else if (VS.aba === 'hist') corpo = abaHist();
  else corpo = abaRac();
  el.innerHTML = `<div class="page home verba">${topo}${corpo}</div>`;
  el.scrollTop = keep;
}

function liga(el) {
  if (VS.ligado) return; VS.ligado = true;
  const ativo = () => st.screen === 'home' && st.homeSec === 'verba';
  const acao = (t, e) => {
    const ds = t.dataset, a = ds.va;
    if (ds.vaba) { VS.aba = ds.vaba; render(); return; }
    if (a === 'extrato') { VS.ext = ds.v; VS.aba = 'ext'; render(); $('#homeView').scrollTop = 0; }
    else if (a === 'xls' && VS.ult) exportaCalc(VS.ult, VS.vend);
    else if (a === 'xlsext' && VS.ult) exportaCalc(VS.ult, VS.ext);
    else if (a === 'imprimir') { document.body.classList.add('imprime-extrato'); setTimeout(() => { window.print(); document.body.classList.remove('imprime-extrato'); }, 50); }
    else if (a === 'salvar' && VS.ult) salvarApuracao(VS.ult, t);
    else if (a === 'lnovo') lancForm({}, ds.nat);
    else if (a === 'ledita') lancForm(VS.store.get(ds.id));
    else if (a === 'anexo') verAnexo(ds.id, +ds.i);
    else if (a === 'limport') R.openImport('lancamentos', { natPadrao: ds.nat });
    else if (a === 'lmodelo') R.downloadModelo('lancamentos');

/* ---------- OpenStreetMap: praças da área visível ---------- */
async function buscaOsm() {
  const m = PS.map; if (!m) { toast('Abra o mapa primeiro'); return; }
  const b = m.getBounds(), s = b.getSouth(), w = b.getWest(), n = b.getNorth(), e = b.getEast();
  if (n - s > 4 || e - w > 4) { toast('Área grande demais: aproxime o mapa (até cerca de 400 km de lado)', 5000); return; }
  toast('Buscando praças no OpenStreetMap…', 20000);
  const q = `[out:json][timeout:40];nwr["barrier"="toll_booth"](${s.toFixed(5)},${w.toFixed(5)},${n.toFixed(5)},${e.toFixed(5)});out center tags;`;
  let j = null, erro = '';
  // O servidor principal fica sobrecarregado às vezes: tenta o espelho antes de desistir
  for (const url of OVERPASS) {
    try {
      const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 45000);
      const r = await fetch(url, { method: 'POST', body: 'data=' + encodeURIComponent(q), headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, signal: ctl.signal }).finally(() => clearTimeout(t));
      if (!r.ok) throw new Error(r.status === 429 || r.status >= 500 ? 'servidor ocupado, tente de novo em 1 minuto' : 'HTTP ' + r.status);
      j = await r.json(); break;
    } catch (err) { erro = err.name === 'AbortError' ? 'o servidor demorou demais para responder' : err.message || String(err); }
  }
  if (!j) { toast('Não foi possível consultar o OpenStreetMap: ' + erro, 6500); return; }
  // Uma praça costuma ter um ponto por cabine ou por sentido: junta os pontos a menos de 300 m que cobram no mesmo rumo
  const pts = (j.elements || []).map(x => ({ lat: isNum(x.lat) ? x.lat : x.center && x.center.lat, lng: isNum(x.lon) ? x.lon : x.center && x.center.lon, t: x.tags || {}, id: x.type + '/' + x.id, dir: rumoOsm(x.tags && x.tags.direction), uni: !!(x.tags && x.tags.direction) })).filter(x => isNum(x.lat) && isNum(x.lng));
  const grupos = [];
  for (const x of pts) {
    const g = grupos.find(g0 => dist(g0, x) < 300 && (g0.dir === null) === (x.dir === null) && (x.dir === null || difAng(g0.dir, x.dir) <= 45));
    if (g) { g.n++; g.lat += (x.lat - g.lat) / g.n; g.lng += (x.lng - g.lng) / g.n; g.ids.push(x.id); if (!g.t.charge && x.t.charge) g.t = x.t; }
    else grupos.push({ lat: x.lat, lng: x.lng, n: 1, t: x.t, ids: [x.id], dir: x.dir, uni: x.uni });
  }
  const L0 = lista(); let novas = 0, ja = 0, comValor = 0;
  for (const g of grupos) {
    if (L0.some(p => (p.osm && g.ids.includes(p.osm)) || (dist(p, g) < 300 && (g.dir === null || !isNum(p.dir) || difAng(p.dir, g.dir) <= 45)))) { ja++; continue; }
    const t = g.t, tar = tarifasOsm(t.charge), id = uid('pd');
    const nome = String(t.name || t['name:pt'] || t.note || '').replace(/\s*[-–]\s*\d+\s*$/, '').trim() || 'Praça de pedágio';
    if (Object.keys(tar).length) comValor++;
    grava({ id, tipo: 'praca', nome, rodovia: String(t.ref || '').toUpperCase(), km: null, concessionaria: t.operator || '', cidade: '', uf: '', lat: +g.lat.toFixed(6), lng: +g.lng.toFixed(6), sentido: g.uni ? 'unico' : 'ambos', dir: g.dir, tarifas: tar, atualizado: /^\d{4}-\d{2}-\d{2}$/.test(t.check_date || '') ? t.check_date : '', obs: Object.keys(tar).length ? 'Tarifas do OpenStreetMap: confira na tabela da concessionária.' : '', fonte: 'OpenStreetMap', osm: g.ids[0], usuario: (st.usuario && st.usuario.nome) || '', em: Date.now() });
    novas++;
  }
  if (novas) R.audita('pedagios', `Incluiu ${novas} praça(s) do OpenStreetMap`);
  toast(novas ? `${novas} praça(s) incluídas${ja ? ` · ${ja} já cadastrada(s)` : ''}. ${comValor === novas ? 'Os valores vieram do OpenStreetMap: confira em Praças.' : `${novas - comValor} sem valor: preencha em Praças.`}` : grupos.length ? `As ${grupos.length} praça(s) desta área já estão cadastradas` : 'Nenhuma praça de pedágio no OpenStreetMap nesta área', 6500);
  if (novas) render();
}
// No OpenStreetMap, "direction" em graus é para onde a cabine está virada (de frente para quem chega):
// o rumo de quem paga é o oposto. Ex.: "Pedágio Perus (sentido Sul)" tem direction=298, e quem paga vai a 118° (sudeste, para a capital).
// "forward"/"backward" dizem que a cobrança é num sentido só, mas sem o rumo: fica como sentido não informado.
function rumoOsm(v) { const g = parseFloat(v); return isFinite(g) && /^\s*-?\d/.test(String(v)) ? (((g + 180) % 360) + 360) % 360 : null; }
// "4.20BRL/motorcar;0.00BRL/motorcycle;4.20BRL/hgv/axle": utilitário de 2 eixos paga 2 × o valor por eixo
function tarifasOsm(ch) {
  const out = {}, re = /(\d+(?:[.,]\d+)?)\s*BRL\s*\/\s*(motorcar|car|motorcycle|hgv|goods)(\s*\/\s*axle)?/gi; let m;
  while ((m = re.exec(String(ch || '')))) {
    const v = numBR(m[1]), k = m[2].toLowerCase(); if (!isNum(v)) continue;
    if (k === 'motorcar' || k === 'car') out.carro = v; else if (k === 'motorcycle') out.moto = v; else out.util = Math.round(v * (m[3] ? 2 : 1) * 100) / 100;
  }
  if (!Object.keys(out).length) { const u = /(\d+(?:[.,]\d{2}))\s*BRL/i.exec(String(ch || '')); if (u) out.carro = numBR(u[1]); }
  return out;
}
function dist(a, b) { const kx = Math.cos(a.lat * Math.PI / 180) * 111320, dx = (a.lng - b.lng) * kx, dy = (a.lat - b.lat) * 110574; return Math.sqrt(dx * dx + dy * dy); }

/* ---------- Traçado pelas ruas (só para esta análise) ---------- */
async function tracar() {
  const U = PS.ultimo; if (!U || PS.job) return;
  const F = U.F, alvo = U.recs.filter(x => !x.path && x.r.pts.length).slice(0, 200); if (!alvo.length) return;
  PS.job = { feitos: 0, total: alvo.length, parar: false }; render();
  const memo = new Map(); let falhas = 0, erro = '';
  for (const x of alvo) {
    if (PS.job.parar) break;
    const r = x.r, nodes = r.base ? [r.base, ...r.pts, r.base] : r.pts;
    if (nodes.length >= 2) {
      try {
        let p = memo.get(r.sig);
        if (!p) { const g = await R.roadRoute(nodes.map(n => ({ lat: n.lat, lng: n.lng }))); p = g.poly ? R.decodePoly(g.poly) : null; if (p) memo.set(r.sig, p); }
        if (p) PS.poly.set(chaveDe(F, r), p);
      } catch (e) { falhas++; erro = (e && e.message) || 'erro'; if (falhas >= 3) break; }
    }
    PS.job.feitos++; const i = $('#pdJob'); if (i) i.textContent = `Traçando pelas ruas: ${PS.job.feitos}/${PS.job.total}`;
  }
  PS.job = null; toast(falhas >= 3 ? `Traçado interrompido: ${erro}` : 'Percursos traçados', 4500); render();
}

    const t = e.target.closest('[data-pa],[data-paba],[data-pfiltro],[data-pfoco],[data-prota]'); if (!t) return;
    const ds = t.dataset;
    if (ds.paba) { PS.aba = ds.paba; if (ds.paba !== 'mapa') PS.marcando = false; render(); return; }
    if (ds.pfiltro) { PS.filtro = ds.pfiltro; PS.vista = null; render(); return; }
    if (ds.pfoco) { const outra = PS.aba !== 'mapa'; PS.foco = ds.pfoco; PS.aba = 'mapa'; render().then(() => { if (outra) { const m = $('#pdMap'); if (m) m.scrollIntoView({ block: 'center' }); } }); return; }
    if (ds.prota) { const outra = PS.aba !== 'mapa'; PS.rota = ds.prota; PS.vista = null; PS.aba = 'mapa'; render().then(() => { if (outra) { const m = $('#pdMap'); if (m) m.scrollIntoView({ block: 'center' }); } }); return; }
    const a = ds.pa;
    if (a === 'nova') pracaForm();
    else if (a === 'edita') pracaForm(pracaDe(ds.id));
    else if (a === 'param') paramForm();
    else if (a === 'modelo') R.downloadModelo('pedagios');
    else if (a === 'importa') R.openImport('pedagios');
    else if (a === 'marcar') { PS.marcando = !PS.marcando; const m = $('#pdMap'); if (m) m.classList.toggle('marcando', PS.marcando); t.classList.toggle('primary', PS.marcando); t.setAttribute('aria-pressed', String(PS.marcando)); t.textContent = PS.marcando ? 'Clique no mapa para marcar a praça' : 'Marcar praça no mapa'; }
    else if (a === 'osm') buscaOsm();
    else if (a === 'tracar') tracar();
    else if (a === 'jobstop' && PS.job) PS.job.parar = true;
    else if (a === 'rotafecha') { PS.rota = ''; PS.vista = null; render(); }
    else if (a === 'xls') exportaRel();
    else if (a === 'xlspracas' && window.XLSX) { saveFile(`pracas_pedagio_${dstamp()}.xlsx`, xlsxBlob([['Pracas', linhasPracas()]])); R.audita('exportacao', 'Praças de pedágio'); }
  });
  el.addEventListener('change', e => {
    if (!ativo()) return; const t = e.target;
    if (t.matches('[data-pfonte]')) { PS.fonte = t.value; PS.vend = ''; PS.dia = 0; PS.rota = ''; PS.vista = null; render(); }
    else if (t.matches('[data-pvend]')) { PS.vend = t.value; PS.rota = ''; PS.vista = null; render(); }
    else if (t.matches('[data-pdia]')) { PS.dia = +t.value; PS.rota = ''; PS.vista = null; render(); }
  });
  let tq;
  el.addEventListener('input', e => { if (!ativo() || !e.target.matches('[data-pq]')) return; PS.q = e.target.value; clearTimeout(tq); tq = setTimeout(() => { const pos = e.target.selectionStart; render().then(() => { const n = $('[data-pq]'); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (x) { /* ignora */ } } }); }, 250); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && PS.marcando && ativo()) { PS.marcando = false; render(); } });
}

/* ---------- Planner: pedágios da rota aberta, nas linhas da lista e no mapa ---------- */
function blocoRota(chave, path, m, fm) {
  if (!PS.store) return '';
  const res = path ? analisa(chave, path) : null;
  return `<div class="stack pd-rota"><span class="lbl">Pedágios</span>${blocoRes(res, fm, !path, !!(m && m.toll))}</div>`;
}
function chip(chave, path) {
  if (!PS.store || !path || !lista().length) return '';
  const res = analisa(chave, path); if (!res) return '';
  return res.itens.length ? `<span class="pd-chip" title="${esc(res.itens.map(i => i.p.nome + (i.tarifa === null ? ' (sem valor)' : '')).join(' · '))}">${ICON_PED}${res.itens.length} · ${brl(res.valor)}${res.semValor ? ' + ?' : ''}</span>` : '<span class="pd-chip ok" title="Sem pedágio no percurso">sem pedágio</span>';
}
// Desenha no mapa do Planner as praças das rotas visíveis (destacadas) e, se todas = true, as demais (apagadas)
function desenha(layer, rotas, todas) {
  if (!PS.store || !lista().length) return;
  const na = new Map();
  for (const x of rotas) { if (!x.path) continue; const res = analisa(x.chave, x.path); if (res) for (const it of res.itens) { const q = na.get(it.p.id) || { cobr: 0, rotas: 0 }; q.cobr += it.cobr; q.rotas++; na.set(it.p.id, q); } }
  for (const p of lista()) {
    const q = na.get(p.id); if (!q && !todas) continue;
    L.marker([p.lat, p.lng], { icon: iconePraca(p, !!q), keyboard: false, zIndexOffset: q ? 400 : -100, opacity: q ? 1 : 0.6 })
      .bindTooltip(tipPraca(p, q), { direction: 'top', offset: [0, -12] }).addTo(layer);
  }
}
function resumoHub() {
  if (!PS.store) return null;
  const L0 = lista(), com = L0.filter(p => tarifa(p) !== null);
  return { n: L0.length, semValor: L0.length - com.length, media: com.length ? brl(com.reduce((s, p) => s + tarifa(p), 0) / com.length) : '—', cat: catNome(cfg().cat) };
}

window.PedMod = { iniciar, render, limpar: limpaMapa, resumoHub, opcoesImport, ligaOpcoesImport, importar, analisa, blocoRota, chip, desenha, icone: ICON_PED, lista };
})();

</script>
